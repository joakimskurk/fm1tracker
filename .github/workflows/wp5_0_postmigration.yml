name: WP5.0 D048 post-migration integration

on:
  push:
    branches:
      - phase5/mixed-engine-routing
    paths:
      - firmware/src/dinghy.c
      - firmware/src/fmt_engine_router.c
      - firmware/src/fmt_engine_router.h
      - firmware/src/fmt_8bit_linked_params.c
      - tests/run_wp5_0_postmigration.sh
      - tests/run_wp5_0_router_host.sh
      - tests/wp5_0_router_host.c
      - .github/workflows/wp5_0_postmigration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postmigration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install host screenshot dependency
        run: python3 -m pip install --disable-pip-version-check Pillow
      - name: Run committed D048 post-migration gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/wp5_0_postmigration
          sh tests/run_wp5_0_postmigration.sh | tee "$RUNNER_TEMP/wp5_0_postmigration.log"
          cp "$RUNNER_TEMP/wp5_0_postmigration.log" build/wp5_0_postmigration/ci.log
          grep -F 'WP5_0_POSTMIGRATION_SOURCE_OK=1 router=production song_mode_gate=absent fm_dsp=absent' build/wp5_0_postmigration/ci.log
          grep -F 'WP5_0_POSTMIGRATION_SHARED_CACHE_OK=1 definitions=1 size_asserts=1 bytes=2048' build/wp5_0_postmigration/ci.log
          grep -F 'WP5_0_POSTMIGRATION_D046_WAV_OK=1 sha256=17fa5ce1759cb728e152d1d3d417a51a13d358908bdcc2dc2e505c27c86a1076 frames=286464' build/wp5_0_postmigration/ci.log
          grep -F 'WP5_0_POSTMIGRATION_SONG_META_NONGATING_OK=1 mode8_mode16_wav=byte_identical sha256=17fa5ce1759cb728e152d1d3d417a51a13d358908bdcc2dc2e505c27c86a1076 frames=286464' build/wp5_0_postmigration/ci.log
          grep -F 'WP5_0_POSTMIGRATION_TARGET_OK=1' build/wp5_0_postmigration/metrics.txt
          grep -F 'WP5_0_POSTMIGRATION_OK=1 production=committed d046_wav=byte_identical song_meta=nongating canonical_8bit=pass target=pinned fm_dsp=absent hardware_margin_claim=none' build/wp5_0_postmigration/ci.log
      - name: Upload D048 post-migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp5-0-d048-postmigration
          if-no-files-found: warn
          path: |
            build/wp5_0_postmigration/**
            build/host/fm1tracker.wav
            build/host/fm1tracker_songmode16.wav
            build/fm1tracker.bin
            build/fm1tracker-0.1.fwsc
