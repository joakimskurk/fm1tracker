name: WP3.7 docs finalize once

on:
  push:
    branches:
      - phase3/plocks-effects
    paths:
      - .github/workflows/_wp3_7_docs_finalize_once.yml

permissions:
  contents: write

jobs:
  finalize-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Propagate WP3.7 closeout into roadmap/test/changelog
        run: python3 .github/tmp/wp3_7_docs_finalize.py

      - name: Commit synchronized documentation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/TEST_MATRIX.md docs/ROADMAP.md CHANGELOG.md
          git commit -m 'docs: complete WP3.7 and stage WP3.8'
          git push origin HEAD:phase3/plocks-effects
