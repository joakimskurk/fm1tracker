name: WP3.8 D034 freeze once

on:
  push:
    branches:
      - phase3/plocks-effects
    paths:
      - .github/workflows/_wp3_8_d034_freeze_once.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Propagate D034 freeze
        run: python3 .github/tmp/wp3_8_d034_freeze.py

      - name: Commit frozen architecture state
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DECISIONS.md docs/PROJECT_STATE.md docs/WORK_PACKAGES.md docs/ROADMAP.md docs/TEST_MATRIX.md
          git commit -m 'docs: freeze D034 runtime event queue'
          git push origin HEAD:phase3/plocks-effects
