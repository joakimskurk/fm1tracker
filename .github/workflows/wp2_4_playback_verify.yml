name: WP2.4 one-track audible playback verification (historical)

# WP2.4 is closed and durably verified by run 39991490860 at
# c8555ce8b68f5813e785b057386110cb177fb9d0. Later Phase 2 packages will
# legitimately extend dinghy.c and tracker interaction, so this package gate is
# manual-only after closeout.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified WP2.4 checkpoint
        uses: actions/checkout@v4
        with:
          ref: c8555ce8b68f5813e785b057386110cb177fb9d0
          fetch-depth: 0

      - name: Explain checkpoint
        run: |
          echo "WP2_4_VERIFIED_COMMIT=c8555ce8b68f5813e785b057386110cb177fb9d0"
          echo "WP2_4_VERIFIED_RUN=39991490860"
          echo "WP2_4_HOST_WAV_SHA256=453dc6b7a2f06a24b1a236ecd692b9beca59f8a070fdc954c4ea1c79c0e13440"
          echo "See docs/WP2_4_VERIFICATION.md for durable evidence."
