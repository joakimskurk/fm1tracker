name: WP2.2 bounds-safe pattern store verification (historical)

# WP2.2 is closed and durably verified by run 39986704633 at
# e180ac8cb5ba7a68fd3932883c988ad9ed67003b. Later Phase 2 packages legitimately
# extend dinghy.c, so this old scope-diff gate is manual-only. Current regression
# coverage is carried forward by the active package workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified WP2.2 checkpoint
        uses: actions/checkout@v4
        with:
          ref: e180ac8cb5ba7a68fd3932883c988ad9ed67003b
          fetch-depth: 0

      - name: Explain checkpoint
        run: |
          echo "WP2_2_VERIFIED_COMMIT=e180ac8cb5ba7a68fd3932883c988ad9ed67003b"
          echo "WP2_2_VERIFIED_RUN=39986704633"
          echo "See docs/WP2_2_VERIFICATION.md for durable evidence."
