name: WP5.9 mixed validation contract freeze

on:
  push:
    branches:
      - phase5/mixed-validation
    paths:
      - 'docs/WP5_9_PRECONTRACT_AUDIT.md'
      - 'docs/WP5_9_MIXED_VALIDATION_CONTRACT.md'
      - 'tests/wp5_9_reference.py'
      - 'tests/run_wp5_9_contract_freeze.sh'
      - '.github/workflows/wp5_9_contract_freeze.yml'
      - 'START_HERE.md'
      - 'docs/PROJECT_STATE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FM1Tracker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install inherited host dependency
        run: python3 -m pip install pillow
      - name: Verify WP5.9 validation-only contract
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_wp5_9_contract_freeze.sh
      - name: Upload WP5.9 contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp5-9-contract-evidence
          path: build/wp5_9_contract/
          if-no-files-found: error
