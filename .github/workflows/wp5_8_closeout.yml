name: WP5.8 D056 closeout

on:
  workflow_dispatch:
  push:
    branches:
      - phase5/fm4-parameters
    paths:
      - 'firmware/src/**'
      - 'firmware/gen/**'
      - 'tests/run_wp5_8_closeout_host.sh'
      - 'tests/run_wp5_8_base_api_tests.sh'
      - 'tests/run_wp5_8_fm_editor_tests.sh'
      - 'tests/run_wp5_8_row_snapshot_tests.sh'
      - 'tests/run_wp5_8_store_resolver_tests.sh'
      - 'tests/run_wp5_8_row_cache_tests.sh'
      - 'tests/run_wp5_8_param_model_tests.sh'
      - 'tests/test_fmt_fm_*.c'
      - '.github/workflows/wp5_8_closeout.yml'

permissions:
  contents: read

jobs:
  closeout-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FM1Tracker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install host UI dependency
        run: python3 -m pip install pillow
      - name: Run D056 closeout host gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/wp5_8_closeout_host
          sh tests/run_wp5_8_closeout_host.sh 2>&1 | tee build/wp5_8_closeout_host/ci.log
      - name: Upload WP5.8 host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp5-8-closeout-host
          path: build/wp5_8_closeout_host/
          if-no-files-found: warn

  closeout-target:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FM1Tracker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install target build UI dependency
        run: python3 -m pip install pillow
      - name: Fetch pinned JieLi toolchain
        shell: bash
        run: |
          set -euo pipefail
          ./tools/get_toolchain.sh "$RUNNER_TEMP/jieli"
          test -x "$RUNNER_TEMP/jieli/toolchain/pi32v2/bin/clang"
          "$RUNNER_TEMP/jieli/toolchain/pi32v2/bin/clang" --version | head -n 2
      - name: Build D056 full application with pinned SDK
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/wp5_8_closeout_target
          mkdir -p "$OUT"
          export JIELI_TOOLCHAIN="$RUNNER_TEMP/jieli/toolchain"
          SDK="$RUNNER_TEMP/ac79-sdk"
          rm -rf "$SDK"
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$SDK"
          ACTUAL_SDK="$(git -C "$SDK" rev-parse HEAD)"
          test "$ACTUAL_SDK" = d179b4484759423312073f5fbb232501aa491047
          export AC79_SDK="$SDK"
          printf 'AC79_SDK_COMMIT=%s\n' "$ACTUAL_SDK" | tee "$OUT/sdk.txt"

          ./build.sh --release 0.1 | tee "$OUT/device.log"
          test -s build/fm1tracker.bin
          test -s build/fm1tracker-0.1.fwsc
          test -s build/fm1tracker.elf
          "$JIELI_TOOLCHAIN/common/bin/objdump" -t build/fm1tracker.elf > "$OUT/symbols.txt"
          grep -F 'fmt_engine_row_param_cache' "$OUT/symbols.txt" | tee "$OUT/row_cache_symbol.txt"
          grep -F 'fmt_fm_instrument_base' "$OUT/symbols.txt" | tee "$OUT/fm_base_symbol.txt"
          grep -F 'fmt_fm_engine_runtime' "$OUT/symbols.txt" | tee "$OUT/fm_engine_symbol.txt"

          python3 - <<'PY' | tee "$OUT/metrics.txt"
          import hashlib
          import re
          from pathlib import Path

          log = Path('build/wp5_8_closeout_target/device.log').read_text()
          m = re.search(r'image (\d+) B of (\d+); RAM \.data\+\.bss (\d+) B of 98304; pool (\d+) B of 344064', log)
          assert m, log[-4000:]
          image, image_limit, ram, pool = map(int, m.groups())
          d055_image = 77048
          d055_ram = 20464
          d055_pool = 113000
          assert image <= 93432, image
          assert ram <= 28656, ram
          assert pool == 113000, pool
          assert image - d055_image <= 16384, image
          assert ram - d055_ram <= 8192, ram
          assert pool - d055_pool == 0, pool

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          print('WP5_8_TARGET_FOOTPRINT_OK=1')
          print(f'image_bytes={image}')
          print(f'normal_ram_bytes={ram}')
          print(f'pool_ram_bytes={pool}')
          print(f'image_delta_vs_d055={image-d055_image}')
          print(f'normal_ram_delta_vs_d055={ram-d055_ram}')
          print(f'pool_delta_vs_d055={pool-d055_pool}')
          print(f'image_margin_to_d056_ceiling={93432-image}')
          print(f'normal_ram_margin_to_d056_ceiling={28656-ram}')
          print(f'fm1tracker_bin_sha256={sha("build/fm1tracker.bin")}')
          print(f'fm1tracker_fwsc_sha256={sha("build/fm1tracker-0.1.fwsc")}')
          PY

          grep -F 'FM1Tracker package' "$OUT/device.log"
          grep -F 'identity FM-1_987' "$OUT/device.log"
          grep -F 'WP5_8_TARGET_FOOTPRINT_OK=1' "$OUT/metrics.txt"
          printf '%s\n' 'WP5_8_CLOSEOUT_TARGET_OK=1 decision=D056 target=pinned image_ceiling=93432 ram_ceiling=28656 pool=113000 resource_bounds=pass d055_engine=linked hardware_margin_claim=none' | tee "$OUT/summary.txt"
      - name: Upload WP5.8 target evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp5-8-closeout-target
          path: build/wp5_8_closeout_target/
          if-no-files-found: warn
