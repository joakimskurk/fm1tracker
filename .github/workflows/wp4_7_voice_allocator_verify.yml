name: WP4.7 deterministic voice allocator verification

on:
  push:
    branches:
      - phase4/8bit-engine
    paths:
      - firmware/src/fmt_voice_allocator.h
      - firmware/src/fmt_voice_allocator.c
      - tests/test_wp4_7_voice_allocator.c
      - tests/run_wp4_7_voice_allocator_tests.sh
      - docs/WP4_7_ALLOCATOR_CONTRACT.md
      - .github/workflows/wp4_7_voice_allocator_verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  allocator-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FM1Tracker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove isolated source boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE=d9f6bf350bcb15a8f3dc62c4fc1112c9f0f1ffa2
          actual="$(git diff --name-only "$BASE" -- firmware/src | sort)"
          expected="$(printf '%s\n' \
            firmware/src/fmt_voice_allocator.c \
            firmware/src/fmt_voice_allocator.h | sort)"
          test "$actual" = "$expected"
          git diff --exit-code "$BASE" -- firmware/src/dinghy.c
          git diff --exit-code "$BASE" -- \
            firmware/src/fmt_engine_pitch.c firmware/src/fmt_engine_pitch.h \
            firmware/src/fmt_osc_pulse.c firmware/src/fmt_osc_pulse.h \
            firmware/src/fmt_osc_noise.c firmware/src/fmt_osc_noise.h \
            firmware/src/fmt_osc_triangle.c firmware/src/fmt_osc_triangle.h \
            firmware/src/fmt_osc_wavetable8.c firmware/src/fmt_osc_wavetable8.h \
            firmware/src/fmt_envelope.c firmware/src/fmt_envelope.h
          echo 'WP4_7_ISOLATED_SOURCE_BOUNDARY_OK=1 new_modules=2 dinghy_delta=0 prior_engine_delta=0'

      - name: Run focused deterministic allocator tests
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_wp4_7_voice_allocator_tests.sh

      - name: Static realtime/source audit
        shell: bash
        run: |
          set -euo pipefail
          files='firmware/src/fmt_voice_allocator.h firmware/src/fmt_voice_allocator.c'
          ! grep -nE '\b(float|double|malloc|calloc|realloc|free)\b' $files
          ! grep -nE '\b(uint64_t|int64_t|long[[:space:]]+long)\b' $files
          ! grep -nE 'Fmt(Song|Step|Lock|Tracker|RtQueue)|fmt_lock_|fmt_store_' firmware/src/fmt_voice_allocator.c
          ! grep -nE '[[:alnum:]_)] *[%/] *[[:alnum:]_(]' firmware/src/fmt_voice_allocator.c
          ! grep -nE '\b(qsort|bsearch|goto)\b' firmware/src/fmt_voice_allocator.c
          test "$(grep -c 'for (i = 0u; i < FMT_VOICE_ALLOCATOR_' firmware/src/fmt_voice_allocator.c)" -le 8
          grep -F 'if (allocator->clock != UINT32_MAX)' firmware/src/fmt_voice_allocator.c
          grep -F 'stage[i] != FMT_ENVELOPE_RELEASE' firmware/src/fmt_voice_allocator.c
          grep -F 'allocator->age[i] == candidate_age && i < candidate' firmware/src/fmt_voice_allocator.c
          echo 'WP4_7_STATIC_AUDIT_OK=1 bounded_slots=8 alloc=0 float=0 int64=0 divide_modulo=0 store_traversal=0 active_cross_track_steal=0'

  allocator-target-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FM1Tracker
        uses: actions/checkout@v4

      - name: Fetch pinned JieLi toolchain
        shell: bash
        run: |
          set -euo pipefail
          ./tools/get_toolchain.sh "$RUNNER_TEMP/jieli"
          test -x "$RUNNER_TEMP/jieli/toolchain/pi32v2/bin/clang"
          "$RUNNER_TEMP/jieli/toolchain/pi32v2/bin/clang" --version | head -n 2

      - name: Compile D043 module for PI32v2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/wp4_7_target
          CC="$RUNNER_TEMP/jieli/toolchain/pi32v2/bin/clang"
          "$CC" -target pi32v2 -Os -ffunction-sections -fno-builtin -Wall -Werror \
            -Ifirmware/src -c firmware/src/fmt_voice_allocator.c \
            -o build/wp4_7_target/fmt_voice_allocator.o
          test -s build/wp4_7_target/fmt_voice_allocator.o
          sha256sum build/wp4_7_target/fmt_voice_allocator.o \
            | tee build/wp4_7_target/object_sha256.txt
          echo 'WP4_7_PI32V2_COMPILE_OK=1 modules=1 allocator_bytes=52 result_bytes=4' \
            | tee build/wp4_7_target/summary.txt

      - name: Upload target object evidence
        uses: actions/upload-artifact@v4
        with:
          name: wp4-7-allocator-target-object
          path: build/wp4_7_target/
