name: WP3.6 closeout docs once

on:
  push:
    branches:
      - phase3/plocks-effects
    paths:
      - .github/workflows/_wp3_6_closeout_docs_once.yml

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize WP3.6 closeout docs
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/wp3_6_closeout.py
          python3 /tmp/wp3_6_closeout.py
          git diff --check

      - name: Commit synchronized docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/WORK_PACKAGES.md docs/ROADMAP.md docs/TEST_MATRIX.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'WP3_6_CLOSEOUT_DOCS_ALREADY_SYNCED=1'
            exit 0
          fi
          git commit -m 'docs: synchronize WP3.6 closeout'
          git push origin HEAD:phase3/plocks-effects
