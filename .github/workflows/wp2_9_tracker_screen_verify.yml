name: WP2.9 tracker screen verification

on:
  push:
    branches:
      - phase2/tracker-core
    paths:
      - .github/workflows/wp2_9_tracker_screen_verify.yml
      - firmware/src/fmt_tracker_screen.h
      - firmware/src/fmt_tracker_screen.c
      - firmware/src/dinghy.c
      - tests/test_fmt_tracker_screen.c
      - tests/run_tracker_screen_tests.sh
      - tests/wp2_9_tracker_screen.script
      - tests/wp2_9_home_return.script
      - tests/wp2_9_home_control.script
      - tests/run_tracker_screen_host.sh
      - tests/wp2_8_special_events_context.script
      - tests/run_special_events_context_host.sh
      - tests/wp2_7_step_rec_context.script
      - tests/run_step_rec_context_host.sh
      - tests/wp2_6_track_context.script
      - tests/run_track_selection_context_host.sh
      - tests/wp2_5_pattern_context.script
      - tests/run_pattern_context_host.sh
      - tests/test_fmt_step_record.c
      - tests/run_step_record_tests.sh
      - tests/test_fmt_playback.c
      - tests/run_playback_tests.sh
      - tests/test_fmt_pattern_input.c
      - tests/run_pattern_input_tests.sh
      - tests/test_fmt_transport.c
      - tests/run_transport_tests.sh
      - tests/test_fmt_store.c
      - tests/run_store_tests.sh
      - tests/test_fmt_model.c
      - tests/run_model_tests.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracker-screen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FM1Tracker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host dependency
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Verify WP2.9 scope and audio-ISR boundary
        shell: bash
        run: |
          set -euo pipefail
          base=5c2830cf2d37c8466f8564aab9a1bd89feaad38a
          git diff --exit-code "$base" -- \
            firmware/app.ld \
            firmware/src/platform.c \
            firmware/src/fmt_model.h \
            firmware/src/fmt_store.h \
            firmware/src/fmt_store.c \
            firmware/src/fmt_transport.h \
            firmware/src/fmt_transport.c \
            firmware/src/fmt_playback.h \
            firmware/src/fmt_playback.c \
            firmware/src/fmt_pattern_input.h \
            firmware/src/fmt_pattern_input.c \
            firmware/src/fmt_step_record.h \
            firmware/src/fmt_step_record.c \
            firmware/hal \
            firmware/loader \
            tools/build.py \
            tools/fm1pkg_make.py \
            tools/fm1_install.py \
            tools/build_fm1tracker.py

          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          base = '5c2830cf2d37c8466f8564aab9a1bd89feaad38a'
          old = subprocess.check_output(['git', 'show', f'{base}:firmware/src/dinghy.c'], text=True)
          new = Path('firmware/src/dinghy.c').read_text()
          def sound_section(text):
              a = text.index('/* ---- the sound')
              b = text.index('/* ---- notes', a)
              return text[a:b]
          assert sound_section(old) == sound_section(new), 'audio section changed in display-only WP2.9'
          print('WP2_9_AUDIO_SECTION_UNCHANGED=1')
          PY

          ! grep -E '\b(uint64_t|int64_t|float|double)\b' \
            firmware/src/fmt_tracker_screen.h firmware/src/fmt_tracker_screen.c
          grep -F 'FMT_TRACKER_SCREEN_ROWS                 8u' firmware/src/fmt_tracker_screen.h
          grep -F 'FMT_TRACKER_SCREEN_REGION_COUNT        10u' firmware/src/fmt_tracker_screen.h
          grep -F 'FMT_TRACKER_SCREEN_MAX_REGIONS_PER_POLL 2u' firmware/src/fmt_tracker_screen.h
          grep -F 'FmtTrackerScreen fmt_tracker_screen_runtime;' firmware/src/dinghy.c
          grep -F 'draws < FMT_TRACKER_SCREEN_MAX_REGIONS_PER_POLL' firmware/src/dinghy.c
          echo "WP2_9_SCOPE_BOUNDARY_OK=1"

      - name: Run frozen compile-time model tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          sh tests/run_model_tests.sh | tee build/wp2_9_model_tests.log
          grep -F "FMT_MODEL_TESTS_OK=1" build/wp2_9_model_tests.log

      - name: Run frozen pattern store tests
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_store_tests.sh | tee build/wp2_9_store_tests.log
          grep -F "FMT_STORE_TESTS_OK=1" build/wp2_9_store_tests.log

      - name: Run frozen integer transport tests
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_transport_tests.sh | tee build/wp2_9_transport_tests.log
          grep -F "FMT_TRANSPORT_TESTS_OK=1" build/wp2_9_transport_tests.log

      - name: Run frozen playback semantics tests
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_playback_tests.sh | tee build/wp2_9_playback_tests.log
          grep -F "FMT_PLAYBACK_TESTS_OK=1" build/wp2_9_playback_tests.log
          grep -F "loop_frames_120=352800" build/wp2_9_playback_tests.log
          grep -F "event_bytes=4 kinds=none,note,tie,off" build/wp2_9_playback_tests.log

      - name: Run page and track input regression tests
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_pattern_input_tests.sh | tee build/wp2_9_pattern_input_tests.log
          grep -F "FMT_PATTERN_INPUT_TESTS_OK=1" build/wp2_9_pattern_input_tests.log

      - name: Run STEP REC and special-event editor regression tests
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_step_record_tests.sh | tee build/wp2_9_step_record_tests.log
          grep -F "FMT_STEP_RECORD_TESTS_OK=1" build/wp2_9_step_record_tests.log
          grep -F "state_bytes=3 pattern=0 note_min=0 note_max=127 wrap=63_to_0 chord=lowest_key specials=empty,tie,off fx_modifier=tested" build/wp2_9_step_record_tests.log

      - name: Run tracker screen model tests
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_tracker_screen_tests.sh | tee build/wp2_9_tracker_screen_tests.log
          grep -F "FMT_TRACKER_SCREEN_TESTS_OK=1" build/wp2_9_tracker_screen_tests.log
          grep -F "state_bytes=44 rows=8 regions=10 max_regions_per_poll=2 pattern=0" build/wp2_9_tracker_screen_tests.log

      - name: Preserve WP2.5 SEQ versus performance gestures
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_pattern_context_host.sh | tee build/wp2_9_wp2_5_context_gate.log
          grep -F "WP2_5_PATTERN_CONTEXT_HOST_OK=1" build/wp2_9_wp2_5_context_gate.log

      - name: Preserve WP2.6 track-selection gestures
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_track_selection_context_host.sh | tee build/wp2_9_wp2_6_context_gate.log
          grep -F "WP2_6_TRACK_CONTEXT_HOST_OK=1" build/wp2_9_wp2_6_context_gate.log

      - name: Preserve WP2.7 STEP REC gestures
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_step_rec_context_host.sh | tee build/wp2_9_wp2_7_context_gate.log
          grep -F "WP2_7_STEP_REC_CONTEXT_HOST_OK=1" build/wp2_9_wp2_7_context_gate.log

      - name: Preserve WP2.8 special-event panel and audio behavior
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_special_events_context_host.sh | tee build/wp2_9_wp2_8_context_gate.log
          grep -F "WP2_8_OFF_AUDIO_BEHAVIOR_OK=1" build/wp2_9_wp2_8_context_gate.log
          grep -F "WP2_8_SPECIAL_EVENTS_CONTEXT_HOST_OK=1" build/wp2_9_wp2_8_context_gate.log

      - name: Verify reviewed tracker screen snapshots and HOME ownership
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_tracker_screen_host.sh | tee build/wp2_9_tracker_screen_gate.log
          grep -F "WP2_9_HOME_RETURN_PIXEL_IDENTICAL=1" build/wp2_9_tracker_screen_gate.log
          grep -F "WP2_9_REVIEWED_SCREEN_HASHES_OK=1" build/wp2_9_tracker_screen_gate.log
          grep -F "WP2_9_TRACKER_SCREEN_HOST_OK=1" build/wp2_9_tracker_screen_gate.log

      - name: Verify frozen WP2.4 audible host regression
        shell: bash
        run: |
          set -euo pipefail
          ./tests/run_host.sh
          test -s build/host/fm1tracker.wav
          sha="$(sha256sum build/host/fm1tracker.wav | awk '{print $1}')"
          echo "HOST_WAV_SHA256=$sha" | tee build/wp2_9_host_audio.txt
          test "$sha" = "453dc6b7a2f06a24b1a236ecd692b9beca59f8a070fdc954c4ea1c79c0e13440"
          echo "WP2_4_AUDIO_REGRESSION_UNCHANGED=1" | tee -a build/wp2_9_host_audio.txt

      - name: Install pinned JieLi toolchain
        shell: bash
        run: |
          set -euo pipefail
          ./tools/get_toolchain.sh "$RUNNER_TEMP/jieli"
          test -x "$RUNNER_TEMP/jieli/toolchain/pi32v2/bin/clang"
          "$RUNNER_TEMP/jieli/toolchain/pi32v2/bin/clang" --version | head -n 2

      - name: Checkout exact official JieLi AC79 SDK release
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/ac79-sdk"
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$sdk"
          actual="$(git -C "$sdk" rev-parse HEAD)"
          echo "AC79_SDK_COMMIT=$actual"
          test "$actual" = "d179b4484759423312073f5fbb232501aa491047"
          test "$(sha256sum "$sdk/cpu/wl82/tools/uboot.boot" | awk '{print $1}')" = \
            "4e3b4c220dc96641cb5a723f41e68ce41d5261ae9434bb33fbd7f2c59976ded4"
          test "$(sha256sum "$sdk/cpu/wl82/tools/cfg_tool.bin" | awk '{print $1}')" = \
            "276579954f076886a6a7694f65dc71c034a63a2c204b76749065c0ac7b010d1b"
          test "$(sha256sum "$sdk/cpu/wl82/tools/cfg/eq_cfg_hw.bin" | awk '{print $1}')" = \
            "41167491bffed4651750719c973d2758adeb9021a5670d02d6a53c85ed80ea7d"
          echo "AC79_SDK_INPUTS_OK=1"

      - name: Build WP2.9 device package
        shell: bash
        run: |
          set -euo pipefail
          JIELI_TOOLCHAIN="$RUNNER_TEMP/jieli/toolchain" \
          AC79_SDK="$RUNNER_TEMP/ac79-sdk" \
          ./build.sh --release 0.1 | tee build/wp2_9_device_build.log

      - name: Capture linked runtime symbols
        shell: bash
        run: |
          set -euo pipefail
          test -s build/fm1tracker.elf
          "$RUNNER_TEMP/jieli/toolchain/common/bin/objdump" -t build/fm1tracker.elf > build/wp2_9_symbols.txt
          for name in fmt_store_storage fmt_transport_runtime fmt_playback_runtime fmt_pattern_input_runtime fmt_step_record_runtime fmt_tracker_screen_runtime; do
            grep -E "${name}$" build/wp2_9_symbols.txt | tee "build/wp2_9_${name}_symbol.txt"
          done
          grep -E 'fmt_store_storage$' build/wp2_9_symbols.txt | grep -F '.pool'
          grep -E 'fmt_transport_runtime$|fmt_playback_runtime$|fmt_pattern_input_runtime$|fmt_step_record_runtime$|fmt_tracker_screen_runtime$' build/wp2_9_symbols.txt | grep -F '.bss'

      - name: Verify identity safety and WP2.9 budgets
        shell: bash
        run: |
          set -euo pipefail
          test -s build/fm1tracker.bin
          test -s build/fm1tracker-0.1.fwsc
          grep -F "register access: hal/ only (src/, loader/ clean)" build/wp2_9_device_build.log

          PYTHONPATH=tools python3 - <<'PY'
          from pathlib import Path
          from fm1_install import product_of
          raw = Path('build/fm1tracker-0.1.fwsc').read_bytes()
          product = product_of(raw)
          assert product == 'FM-1_987', product
          print('PACKAGE_IDENTITY=' + product)
          PY

          python3 - <<'PY' | tee build/wp2_9_metrics.txt
          import hashlib
          import os
          import re
          from pathlib import Path

          build_log = Path('build/wp2_9_device_build.log').read_text()
          m = re.search(r"image (\d+) B of (\d+); RAM \.data\+\.bss (\d+) B of 98304; pool (\d+) B of 344064", build_log)
          assert m, 'resource line not found'
          image, image_limit, ram, pool = map(int, m.groups())
          base_image, base_ram, base_pool = 56748, 12420, 96616

          symbols = Path('build/wp2_9_symbols.txt').read_text().splitlines()
          def one(name):
              lines = [line for line in symbols if line.rstrip().endswith(name)]
              assert len(lines) == 1, (name, lines)
              return lines[0].split()

          store = one('fmt_store_storage')
          transport = one('fmt_transport_runtime')
          playback = one('fmt_playback_runtime')
          pattern_input = one('fmt_pattern_input_runtime')
          step_record = one('fmt_step_record_runtime')
          tracker_screen = one('fmt_tracker_screen_runtime')

          assert '.pool' in store
          for sym in (transport, playback, pattern_input, step_record, tracker_screen):
              assert '.bss' in sym

          store_address = int(store[0], 16)
          store_size = int(store[-2], 16)
          transport_size = int(transport[-2], 16)
          playback_size = int(playback[-2], 16)
          pattern_input_size = int(pattern_input[-2], 16)
          step_record_size = int(step_record[-2], 16)
          tracker_screen_address = int(tracker_screen[0], 16)
          tracker_screen_size = int(tracker_screen[-2], 16)

          assert store_address == 0x01C20000
          assert store_size == 65896
          assert transport_size == 8
          assert playback_size == 1
          assert pattern_input_size == 4
          assert step_record_size == 3
          assert tracker_screen_size == 44
          assert tracker_screen_size <= 64
          assert pool == base_pool, (pool, base_pool)
          assert ram >= base_ram, (ram, base_ram)
          assert ram - base_ram <= 64, (ram, base_ram)
          assert image >= base_image, (image, base_image)
          assert image - base_image <= 8192, (image, base_image)

          print('WP2.9 compact tracker screen metrics')
          print(f"commit={os.environ['GITHUB_SHA']}")
          print(f'image_bytes={image}')
          print(f'image_limit_bytes={image_limit}')
          print(f'image_delta_bytes={image - base_image}')
          print(f'normal_ram_bytes={ram}')
          print(f'normal_ram_delta_bytes={ram - base_ram}')
          print(f'pool_ram_bytes={pool}')
          print(f'pool_ram_delta_bytes={pool - base_pool}')
          print(f'tracker_screen_state_bytes={tracker_screen_size}')
          print(f'tracker_screen_state_address=0x{tracker_screen_address:08x}')
          print(f'store_bytes={store_size}')
          print(f'store_address=0x{store_address:08x}')
          print('visible_rows=8')
          print('dirty_regions=10')
          print('max_regions_per_poll=2')
          print('screen_viewport=cursor_owned_half_page')
          print(f"fm1tracker_bin_sha256={hashlib.sha256(Path('build/fm1tracker.bin').read_bytes()).hexdigest()}")
          print(f"fm1tracker_fwsc_sha256={hashlib.sha256(Path('build/fm1tracker-0.1.fwsc').read_bytes()).hexdigest()}")
          print(f"host_wav_sha256={hashlib.sha256(Path('build/host/fm1tracker.wav').read_bytes()).hexdigest()}")
          PY

          grep -F "pool_ram_delta_bytes=0" build/wp2_9_metrics.txt
          grep -F "tracker_screen_state_bytes=44" build/wp2_9_metrics.txt
          grep -F "max_regions_per_poll=2" build/wp2_9_metrics.txt
          echo "WP2_9_TRACKER_SCREEN_AND_BUDGET_OK=1"

      - name: Upload WP2.9 evidence
        uses: actions/upload-artifact@v4
        with:
          name: wp2-9-tracker-screen-evidence
          path: |
            build/wp2_9_model_tests.log
            build/wp2_9_store_tests.log
            build/wp2_9_transport_tests.log
            build/wp2_9_playback_tests.log
            build/wp2_9_pattern_input_tests.log
            build/wp2_9_step_record_tests.log
            build/wp2_9_tracker_screen_tests.log
            build/wp2_9_wp2_5_context_gate.log
            build/wp2_5_pattern_context_host.log
            build/wp2_9_wp2_6_context_gate.log
            build/wp2_6_track_context_host.log
            build/wp2_9_wp2_7_context_gate.log
            build/wp2_7_step_rec_context_host.log
            build/wp2_9_wp2_8_context_gate.log
            build/wp2_8_special_events_context_host.log
            build/wp2_9_tracker_screen_gate.log
            build/wp2_9_tracker_screen_host.log
            build/wp2_9_home_return_host.log
            build/wp2_9_home_control_host.log
            build/wp2_9_host_audio.txt
            build/wp2_9_device_build.log
            build/wp2_9_symbols.txt
            build/wp2_9_*_symbol.txt
            build/wp2_9_metrics.txt
            build/fm1tracker.bin
            build/fm1tracker-0.1.fwsc
            build/host/fm1tracker.wav
            build/host/fm1tracker_wp2_9_tracker-1000.ppm
            build/host/fm1tracker_wp2_9_tracker-3000.ppm
            build/host/fm1tracker_wp2_9_tracker-1000.png
            build/host/fm1tracker_wp2_9_tracker-3000.png
            build/host/fm1tracker_wp2_9_home_return-3000.png
