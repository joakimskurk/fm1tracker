name: WP2.9 tracker screen verification (historical)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified WP2.9 checkpoint
        uses: actions/checkout@v4
        with:
          ref: e53d785b811371cf817d22be1fc8631b1e12cd12
          fetch-depth: 0

      - name: Record frozen verification evidence
        run: |
          echo "WP2_9_VERIFIED_COMMIT=e53d785b811371cf817d22be1fc8631b1e12cd12"
          echo "WP2_9_VERIFIED_RUN=40009689758"
          echo "WP2_9_VERIFIED_JOB=120606559644"
          echo "WP2_9_EVIDENCE=docs/WP2_9_VERIFICATION.md"
          test "$(git rev-parse HEAD)" = "e53d785b811371cf817d22be1fc8631b1e12cd12"
