name: WP5.8 apply FM editor

on:
  push:
    branches:
      - phase5/fm4-parameters
    paths:
      - 'tools/wp5_8_apply_fm_editor_patch.py'
      - 'tests/test_fmt_fm_linked_editor.c'
      - 'tests/test_fmt_fm_row_cache.c'
      - 'tests/run_wp5_8_fm_editor_tests.sh'
      - '.github/workflows/wp5_8_apply_fm_editor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install inherited host dependency
        run: python3 -m pip install pillow
      - name: Apply guarded D056 FM editor patch
        run: python3 tools/wp5_8_apply_fm_editor_patch.py
      - name: Check production patch
        run: |
          git diff --check
          git diff --exit-code -- firmware/src/fmt_fm_engine.c firmware/src/fmt_fm_engine.h
          git diff --name-only -- firmware/src | sort
      - name: Verify FM editor before commit
        run: sh tests/run_wp5_8_fm_editor_tests.sh
      - name: Commit guarded production patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/src/dinghy.c firmware/src/fmt_lock_editor.c
          git diff --cached --exit-code && exit 1 || true
          git commit -m 'feat(wp5.8): integrate page-aware FM held-step editor'
          git push origin HEAD:phase5/fm4-parameters
