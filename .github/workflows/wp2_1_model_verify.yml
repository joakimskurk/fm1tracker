name: WP2.1 historical compile-time model verification

# WP2.1 is closed. Its final durable evidence is docs/WP2_1_VERIFICATION.md
# and Actions run 39985124933. Later Phase 2 packages have their own gates;
# this workflow remains manual so legitimate later changes do not trip the
# old WP2.1 scope-diff assertion.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-model-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final verified WP2.1 checkpoint
        uses: actions/checkout@v4
        with:
          ref: 3e922da4a33894bc938e3252e575a2908355f3a3

      - name: Run frozen WP2.1 model tests
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_model_tests.sh
