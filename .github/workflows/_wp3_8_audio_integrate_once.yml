name: WP3.8 audition queue integration once

on:
  push:
    branches:
      - phase3/plocks-effects
    paths:
      - .github/workflows/_wp3_8_audio_integrate_once.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate D034 audition queue ownership
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/fmt_pattern_input_runtime\.track/fmt_pattern_input_runtime.selected_track/g' .github/tmp/wp3_8_audio_integrate.py
          python3 .github/tmp/wp3_8_audio_integrate.py

      - name: Run D034 isolated queue tests
        run: sh tests/run_rt_queue_tests.sh

      - name: Run D034 full-app audition and overflow proof
        run: sh tests/run_wp3_8_queue_audio_host.sh

      - name: Preserve D033 full-app event audio
        run: sh tests/run_wp3_7_event_audio_host.sh

      - name: Preserve D032 full-app effect audio
        run: sh tests/run_wp3_6_effect_audio_host.sh

      - name: Preserve D031 locked audio
        run: sh tests/run_wp3_5_locked_audio_host.sh

      - name: Verify source boundary
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F '#include "fmt_rt_queue.c"' firmware/src/dinghy.c
          grep -F 'audition_consume_queue();' firmware/src/dinghy.c
          grep -F 'fmt_rt_queue_enqueue_note_on' firmware/src/dinghy.c
          grep -F 'fmt_rt_queue_enqueue_note_off' firmware/src/dinghy.c
          grep -F 'fmt_pattern_input_runtime.selected_track' firmware/src/dinghy.c
          test "$(grep -c 'voice\[pick\]\.gate =' firmware/src/dinghy.c)" -eq 1
          test "$(grep -c 'voice\[v\]\.gate = 0' firmware/src/dinghy.c)" -eq 2

      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/src/dinghy.c
          git commit -m 'feat: route audition notes through D034 queue'
          git push origin HEAD:phase3/plocks-effects
