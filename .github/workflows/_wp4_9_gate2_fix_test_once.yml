name: WP4.9 Gate 2 test warning fix once

on:
  push:
    branches:
      - phase4/8bit-engine
    paths:
      - .github/workflows/_wp4_9_gate2_fix_test_once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove dead test local
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/test_wp4_9_gate2.c')
          s = p.read_text()
          old = '    uint32_t word = 0u;\n\n'
          assert s.count(old) == 1
          p.write_text(s.replace(old, '', 1))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_wp4_9_gate2.c
          git commit -m 'test: fix D045 Gate 2 warning'
          git push origin HEAD:phase4/8bit-engine
