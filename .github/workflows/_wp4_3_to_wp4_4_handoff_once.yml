name: WP4.3 to WP4.4 handoff once

on:
  push:
    branches:
      - phase4/8bit-engine
    paths:
      - .github/workflows/_wp4_3_to_wp4_4_handoff_once.yml
      - .github/tmp/wp4_3_to_wp4_4_handoff.py

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Close WP4.3 docs and activate WP4.4
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tmp/wp4_3_to_wp4_4_handoff.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_STATE.md docs/WORK_PACKAGES.md docs/ROADMAP.md docs/TEST_MATRIX.md
          git commit -m 'docs: close WP4.3 and activate WP4.4'
          git push origin HEAD:phase4/8bit-engine
