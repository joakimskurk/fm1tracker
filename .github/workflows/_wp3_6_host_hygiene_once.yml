name: WP3.6 host fixture hygiene once

on:
  push:
    branches:
      - phase3/plocks-effects
    paths:
      - .github/workflows/_wp3_6_host_hygiene_once.yml

permissions:
  contents: write

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean host initializers and freeze effect WAV hashes
        shell: bash
        run: |
          set -euo pipefail
          echo ' ' | base64 -d > /tmp/wp3_6_host_hygiene.py
          python3 /tmp/wp3_6_host_hygiene.py
          git diff --check
          mkdir -p build
          sh tests/run_tracker_effect_tests.sh
          sh tests/run_wp3_6_effect_audio_host.sh
          cc -O2 -Wall -Wextra -Werror -Wno-unused-function -DDINGHY_HOST -DAPP_NAME='"FM1TRACKER"' -DAPP_VER='"hygiene"' -Ifirmware/src -Ifirmware/gen -o build/host/fm1tracker_wp3_6_werror firmware/src/dinghy.c
          grep -F 'WP3_6_EFFECT_AUDIO_BEHAVIOR_OK=1' build/wp3_6_effect_audio_analysis.txt
          echo 'WP3_6_HOST_HYGIENE_OK=1'
      - name: Commit warning cleanup and frozen hashes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/host.c tests/run_wp3_6_effect_audio_host.sh
          git commit -m 'WP3.6: clean host fixtures and freeze effect audio hashes'
          git push origin HEAD:phase3/plocks-effects
