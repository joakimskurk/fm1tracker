name: WP3.9 integrate visual feedback once

on:
  push:
    branches:
      - phase3/plocks-effects
    paths:
      - .github/workflows/_wp3_9_integrate_visual_once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate D035 app sync and storage-only footer marker
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tmp/wp3_9_integrate_visual.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/src/dinghy.c firmware/src/fmt_lock_editor.c tests/test_fmt_lock_editor.c
          git commit -m 'feat: integrate D035 tracker visual feedback'
          git push origin HEAD:phase3/plocks-effects
