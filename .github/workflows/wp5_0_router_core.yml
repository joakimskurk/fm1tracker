name: WP5.0 D048 router core

on:
  push:
    branches:
      - phase5/mixed-engine-routing
    paths:
      - firmware/src/fmt_engine_router.c
      - firmware/src/fmt_engine_router.h
      - tests/wp5_0_router_host.c
      - tests/run_wp5_0_router_host.sh
      - .github/workflows/wp5_0_router_core.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  router-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run D048 router core host gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/wp5_0_router
          sh tests/run_wp5_0_router_host.sh | tee build/wp5_0_router/ci.log
          grep -F 'WP5_0_ROUTER_SIZE_OK=1 bytes=8' build/wp5_0_router/ci.log
          grep -F 'WP5_0_IDENTITY_PUBLICATION_OK=1 instruments=16 bytes=64' build/wp5_0_router/ci.log
          grep -F 'WP5_0_ROUTER_CORE_OK=1 tracks=8 families=2 unknown_family=safe' build/wp5_0_router/ci.log
          grep -F 'WP5_0_SONG_MODE_NONGATING_PUBLICATION_OK=1 mode0_mode1_identity_words=identical' build/wp5_0_router/ci.log
          grep -F 'WP5_0_ROUTER_CORE_BOUND_OK=1 heap=0 family_dsp_dependencies=0 fixed_tracks=8 fixed_instruments=16' build/wp5_0_router/ci.log
      - name: Upload router core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp5-0-d048-router-core
          if-no-files-found: warn
          path: build/wp5_0_router/*.log
