name: WP2.6 black-key track selection verification (historical)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified WP2.6 checkpoint
        uses: actions/checkout@v4
        with:
          ref: 707d0b24eb15c19193136f68e7c9f4e1d0a7dc7d

      - name: Identify frozen evidence
        run: |
          test "$(git rev-parse HEAD)" = "707d0b24eb15c19193136f68e7c9f4e1d0a7dc7d"
          echo "WP2.6 verified by Actions run 39995856373, job 120559070230"
          echo "Durable evidence: docs/WP2_6_VERIFICATION.md"
