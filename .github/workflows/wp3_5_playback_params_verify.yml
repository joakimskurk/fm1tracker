name: WP3.5 playback parameter verification

on:
  push:
    branches:
      - phase3/plocks-effects
    paths:
      - .github/workflows/wp3_5_playback_params_verify.yml
      - docs/DECISIONS.md
      - firmware/src/dinghy.c
      - firmware/src/fmt_playback_params.h
      - firmware/src/fmt_playback_params.c
      - tests/test_fmt_playback_params.c
      - tests/run_playback_params_tests.sh
      - tests/wp3_5_locked_audio.script
      - tests/wp3_5_locked_audio_control.script
      - tests/run_wp3_5_locked_audio_host.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playback-params-focused:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FM1Tracker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host screenshot dependency
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Verify focused WP3.5 scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          base = '01b35603ec387e079e4af512f8a8109e413d2714'
          allowed = {
              '.github/workflows/wp3_5_playback_params_verify.yml',
              'docs/PROJECT_STATE.md',
              'docs/DECISIONS.md',
              'firmware/src/dinghy.c',
              'firmware/src/fmt_playback_params.h',
              'firmware/src/fmt_playback_params.c',
              'tests/test_fmt_playback_params.c',
              'tests/run_playback_params_tests.sh',
              'tests/wp3_5_locked_audio.script',
              'tests/wp3_5_locked_audio_control.script',
              'tests/run_wp3_5_locked_audio_host.sh',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', base, 'HEAD'], text=True
          ).splitlines())
          unexpected = sorted(changed - allowed)
          assert not unexpected, unexpected
          print('WP3_5_FOCUSED_SCOPE_OK=1')
          PY

      - name: Verify append-only D031 decision
        shell: bash
        run: |
          set -euo pipefail
          git show 7b448004be4dbdc9230528547f0d6bc8b1d6e5ba:docs/DECISIONS.md > /tmp/old.md
          python3 - <<'PY'
          from pathlib import Path
          old = Path('/tmp/old.md').read_bytes()
          new = Path('docs/DECISIONS.md').read_bytes()
          assert new.startswith(old)
          suffix = new[len(old):]
          assert suffix.startswith(b'\n## D031 ')
          print('D031_APPEND_ONLY_OK=1')
          PY

      - name: Run D031 playback parameter tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          sh tests/run_playback_params_tests.sh | tee build/wp3_5_playback_params.log
          grep -F 'FMT_PLAYBACK_PARAMS_TESTS_OK=1' build/wp3_5_playback_params.log
          grep -F 'cache_bytes=256 rows=64 word_bytes=4 defaults=255,128,255 active_params=voice,fine,track pan=storage_only' build/wp3_5_playback_params.log
          grep -F 'row_local=1 domain_fallback=1 structural_fallback=1 no_store_mutation=1 voice_state_bytes=6' build/wp3_5_playback_params.log

      - name: Run inherited playback and lock foundations
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_playback_tests.sh | grep -F 'FMT_PLAYBACK_TESTS_OK=1'
          sh tests/run_lock_store_tests.sh | grep -F 'FMT_LOCK_STORE_TESTS_OK=1'
          sh tests/run_param_registry_tests.sh | grep -F 'FMT_PARAM_REGISTRY_TESTS_OK=1'
          sh tests/run_lock_editor_tests.sh | grep -F 'FMT_LOCK_EDITOR_TESTS_OK=1'
          echo 'WP3_5_FOUNDATION_REGRESSIONS_OK=1'

      - name: Preserve frozen no-lock audio
        shell: bash
        run: |
          set -euo pipefail
          ./tests/run_host.sh
          sha="$(sha256sum build/host/fm1tracker.wav | awk '{print $1}')"
          test "$sha" = '453dc6b7a2f06a24b1a236ecd692b9beca59f8a070fdc954c4ea1c79c0e13440'
          echo "WP3_5_DEFAULT_WAV_UNCHANGED=$sha"

      - name: Prove locked audio behavior
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_wp3_5_locked_audio_host.sh
          grep -F 'WP3_5_LOCKED_AUDIO_BEHAVIOR_OK=1 pre_equal=1 combined_level=1 fine_pitch=1 empty_mute=1 unlocked_restore=1 midi_events=0' build/wp3_5_locked_audio_analysis.txt
