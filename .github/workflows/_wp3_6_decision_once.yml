name: WP3.6 freeze D032 once

on:
  push:
    branches:
      - phase3/plocks-effects
    paths:
      - .github/workflows/_wp3_6_decision_once.yml

permissions:
  contents: write

jobs:
  decision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append D032 and mark WP3.6 active
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('docs/DECISIONS.md')
          s = p.read_text()
          assert '## D032 —' not in s
          d = r'''

## D032 — WP3.6 uses explicit row tracker-effect commands with six exact D020-derived subticks

Date: 2026-10-24
Status: accepted for the WP3.6 one-lane proof

**Decision:** WP3.6 keeps tracker-effect commands separate from D027 parameter IDs. Effects live only in the existing `FmtStep.effect` and `FmtStep.effect_value` bytes on the current pattern-0 / track-0 proof lane.

The first assigned tracker-effect command IDs are:

- `0x00` NONE, already frozen as `FMT_EFFECT_NONE`;
- `0x01` ARPEGGIO;
- `0x02` SLIDE;
- `0x03` PORTAMENTO;
- `0x04` VIBRATO.

All other command bytes are unassigned in WP3.6 and resolve safely to NONE for playback. They are not reinterpreted as D027 parameter IDs. No new p-lock parameter IDs are created by this package.

### Effect-value encodings

The one-byte `effect_value` is explicit on every row. WP3.6 introduces **no zero-value effect-memory shorthand**.

**ARPEGGIO `0x01`** uses packed nibbles `XY`:

- X = high nibble, unsigned semitone offset `0..15`;
- Y = low nibble, unsigned semitone offset `0..15`.

Across the six tracker subtick slots of a row, the transient semitone offsets are:

`0, +X, +Y, 0, +X, +Y`.

The arpeggio offset never changes persistent pitch state.

**SLIDE `0x02`** interprets `effect_value` as signed two's-complement `int8_t` in Q7 semitone units per tracker subtick:

- `0x01..0x7F` = `+1..+127` / 128 semitone per subtick;
- `0x80..0xFF` = `-128..-1` / 128 semitone per subtick;
- `0x00` = zero motion, not effect-memory reuse.

Each crossed subtick adds this delta to persistent center pitch and clamps to `0..16383` Q7.

**PORTAMENTO `0x03`** interprets `effect_value` as an unsigned Q7 semitone rate per tracker subtick:

- `0x00` = zero motion;
- `0x01..0xFF` = `1..255` / 128 semitone per subtick.

A NOTE row with PORTAMENTO and an already logically active proof note sets a new coarse target pitch but does not jump the persistent center pitch to the new note. Each subtick moves center pitch toward the target by at most the encoded rate, with exact clamp at the target. A NOTE+PORTAMENTO when no note is logically active starts directly at its target because there is no previous audible pitch to glide from. TIE/EMPTY rows carrying PORTAMENTO continue toward the last target. A row without PORTAMENTO stops movement but does not erase the pitch position already reached.

**VIBRATO `0x04`** uses packed nibbles `SD`:

- S = high nibble, `0..15` phase steps per tracker subtick;
- D = low nibble, `0..15` depth units of `1/16` semitone.

Vibrato uses a deterministic 16-position integer triangle with normalized values:

`0, 4, 8, 12, 16, 12, 8, 4, 0, -4, -8, -12, -16, -12, -8, -4`.

The transient Q7 offset is `triangle * (D * 8) / 16`, using bounded signed integer arithmetic. Vibrato never changes persistent center pitch. Phase resets to 0 when entering VIBRATO from another command/NONE, continues across consecutive VIBRATO rows, and resets when leaving VIBRATO. Speed or depth 0 is a literal zero/hold value, not memory reuse.

### Persistent center pitch and D031 FINE precedence

WP3.6 separates coarse/stateful pitch from row-local fine pitch.

Persistent `center_q7` is the state changed by NOTE, SLIDE and PORTAMENTO. A normal NOTE row that is not an active-note PORTAMENTO target sets `center_q7 = note * 128` and `target_q7 = center_q7`. SLIDE changes center directly. PORTAMENTO moves center toward its remembered coarse NOTE target. ARPEGGIO and VIBRATO only add transient offsets.

D031 FINE PITCH remains row-local. Its signed offset is:

`fine_q7 = fine_value - 128`.

The audible pitch for an active proof note is therefore:

`clamp(center_q7 + fine_q7 + transient_effect_q7, 0, 16383)`.

This freezes precedence: stateful slide/porta establish the center; D031 FINE shifts the current row around that center; ARPEGGIO/VIBRATO add their transient modulation. FINE does not modify the stored slide/porta center or target.

### NOTE / TIE / OFF / EMPTY interaction

D025/D031 logical note-active state remains authoritative.

- **NOTE:** without active-note PORTAMENTO, resets persistent center/target to the new coarse note. With PORTAMENTO and an already active note, updates only the coarse target and glides from the current center. D031 level/fine rules still apply.
- **TIE:** never retriggers or replaces the coarse target note. Current row effects may modulate/move an already active note.
- **EMPTY / NONE:** sends no note event, but an already active note may still be modulated/moved by the row effect exactly like D031 p-locks can affect an EMPTY row.
- **OFF:** clears logical note-active state, clears the current row effect/transient modulation and cannot be resurrected by later TIE/EMPTY/effect rows. The click-safe release tail keeps its last oscillator increment. A later NOTE starts a new center/target.

A D031 zero-level row remains a mute rather than semantic NOTE OFF. While the note is still logically active, SLIDE/PORTAMENTO state may continue to advance on its effect subticks even when audible level is zero.

### Row command and effect-state memory

The command/value pair itself is row-local. NONE on the next row means no new ARP/SLIDE/PORTA/VIBRATO action for that row.

State that is musically the result of prior pitch motion is intentionally retained:

- SLIDE leaves `center_q7` where the previous row moved it;
- PORTAMENTO leaves both current center and the last coarse target available, but movement occurs only on rows that explicitly carry PORTAMENTO;
- VIBRATO phase continues only across consecutive VIBRATO rows and resets on any non-VIBRATO row;
- ARPEGGIO has no persistent modulation state beyond the six subtick slots of its current row.

There is no implicit reuse of a previous nonzero effect value when the current row value is zero.

### Exact six-subtick timing

WP3.6 adds one effect clock in the same exact integer phase domain as D020.

The effect clock has the same threshold `FMT_TRANSPORT_PHASE_PER_STEP = 661500`. After each rendered audio frame, while transport is running, it adds:

`bpm * 6`

to its phase. Because `65535 * 6 = 393210 < 661500`, at most one effect subtick can cross in one audio frame even at maximum supported integer BPM. On crossing, subtract the threshold once and advance the row subtick slot modulo 6.

Order is frozen:

1. render the current audio frame with the current pitch/effect state;
2. advance the WP3.6 effect clock and apply at most one subtick update;
3. advance D020/D021 transport for that elapsed frame;
4. if the row boundary crosses, dispatch the next D025/D031 event and the next row effect snapshot for the next rendered frame.

The sixth effect subtick at a row boundary therefore completes stateful SLIDE/PORTAMENTO motion before the next row command is applied. ARPEGGIO/VIBRATO transient output is replaced/reset by the new row contract before the next frame.

The effect clock stops whenever transport stops and resumes from the same phase. At a fresh playback reset/start it begins at phase 0 / subtick slot 0. This gives exactly six rational tracker subticks per D020 row without floating point, runtime division or drift.

### Main/editor to audio ownership

`FmtPlaybackEvent` remains exactly 4 bytes and is not enlarged.

WP3.6 introduces a separate fixed cache for all 64 proof-lane rows. Each published row effect is one naturally aligned 32-bit word:

- bits `0..7`: effect command;
- bits `8..15`: effect value;
- bits `16..23`: resolver flags/status;
- bits `24..31`: reserved, zero in WP3.6.

The cache therefore costs exactly 256 B ordinary RAM. Main/startup code reads `FmtStep.effect/effect_value`, validates the command and publishes one complete 32-bit word per row. Unassigned commands publish playback NONE with an invalid-command flag. Invalid caller coordinates are rejected without out-of-bounds writes.

Audio reads exactly one aligned 32-bit effect snapshot at D021 row dispatch. It never rereads `FmtStep.effect/effect_value` in the per-sample path and never touches editor-owned mutable structures. A future effect editor must refresh the affected row cache from main context after mutation; WP3.6 itself adds no panel effect editor.

This cache is deliberately not the WP3.8 general event queue.

### Hard real-time bounds

Per rendered frame, WP3.6 adds only one fixed 32-bit effect-phase add/compare while transport is running. At most one effect-subtick transition may occur per frame. Each transition executes one fixed command branch with bounded integer add/clamp/table work and no loops over song/lock data.

At row dispatch, audio performs one fixed 32-bit cache read and fixed state update. No allocator, linked-list traversal, screen work, flash work, retry loop, float or runtime 64-bit division enters the ISR.

### Regression/evidence rule

With all effect fields at their reset defaults (`NONE`, value `0`), the historical no-lock/default host WAV must remain byte-identical:

`453dc6b7a2f06a24b1a236ecd692b9beca59f8a070fdc954c4ea1c79c0e13440`.

WP3.6 must add deterministic host/unit evidence for each of ARPEGGIO, positive/negative SLIDE, PORTAMENTO, VIBRATO, D031 FINE composition, NOTE/TIE/EMPTY/OFF interaction, exact six-subtick timing, invalid-command fallback and stored-data non-mutation. Effect-specific audio/event evidence gets separate frozen hashes/markers and does not replace the historical no-effect regression.

**Reason:** `FmtStep` already has exactly two tracker-effect bytes, and D027 explicitly separates tracker commands from semantic parameter IDs. Six integer subticks give familiar tracker-style modulation while remaining exactly derivable from D020 at every BPM. Persistent center pitch makes slide/portamento musically useful without hidden command-value memory; transient arp/vibrato remain bounded. A second 64-word cache preserves the proven D031 main-to-audio ownership pattern and keeps the 4-byte playback event/general queue work untouched.

**Consequence:** WP3.6 may add the four command constants, one pure effect cache/state module, one 256-byte ordinary-RAM cache and the minimal proof-voice integration. Tests must prove the exact encodings, all 64 cache rows, six-subtick clock behavior, pitch-state rules, D031 composition and unchanged default WAV before full target/resource closeout. WP3.7 retrig/note-delay/note-cut and WP3.8 queue work remain separate.
'''
          p.write_text(s.rstrip() + d + '\n')

          p = Path('docs/WORK_PACKAGES.md')
          s = p.read_text()
          old = '- **WP3.6 — arpeggio / slide / portamento / vibrato tracker effects** — READY TO START — issue #25.'
          new = '- **WP3.6 — arpeggio / slide / portamento / vibrato tracker effects** — IN PROGRESS — issue #25.'
          assert old in s
          p.write_text(s.replace(old, new, 1))
          print('D032_APPENDED=1')
          PY
          git diff --check

      - name: Commit D032
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DECISIONS.md docs/WORK_PACKAGES.md
          git commit -m 'docs: freeze D032 tracker effect semantics'
          git push origin HEAD:phase3/plocks-effects
