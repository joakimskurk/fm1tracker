name: WP3.1 parameter registry verification (historical)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified WP3.1 checkpoint
        uses: actions/checkout@v4
        with:
          ref: 5af8065a9c98884d22682075b600d9790cfa7940
          fetch-depth: 0

      - name: Record frozen verification evidence
        run: |
          echo "WP3_1_VERIFIED_COMMIT=5af8065a9c98884d22682075b600d9790cfa7940"
          echo "WP3_1_VERIFIED_RUN=40025790828"
          echo "WP3_1_VERIFIED_JOB=120661526848"
          echo "WP3_1_EVIDENCE=docs/WP3_1_VERIFICATION.md"
          test "$(git rev-parse HEAD)" = "5af8065a9c98884d22682075b600d9790cfa7940"
