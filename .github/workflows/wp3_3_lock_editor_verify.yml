name: WP3.3 p-lock editor verification (historical)

# WP3.3 is complete. This workflow is intentionally manual-only and always
# verifies the exact final source/workflow checkpoint that passed run
# 40054322180 / job 120753812201. Durable evidence lives in
# docs/WP3_3_VERIFICATION.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-editor-historical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified WP3.3 checkpoint
        uses: actions/checkout@v4
        with:
          ref: df5d7e07fc763909a141c99283cfd2be19cff847
          fetch-depth: 0

      - name: Install inherited host-screen dependency
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Run frozen WP3.3 closeout gate
        shell: bash
        run: sh tests/run_wp3_3_closeout_ci.sh

      - name: Upload historical WP3.3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: wp3-3-lock-editor-historical
          path: |
            build/wp3_3_lock_editor_tests.log
            build/wp3_3_lock_editor_context_gate.log
            build/wp3_3_lock_editor_context_host.log
            build/wp3_3_host_audio.txt
            build/wp3_3_device_build.log
            build/wp3_3_symbols.txt
            build/wp3_3_metrics.txt
            build/fm1tracker.bin
            build/fm1tracker-0.1.fwsc
            build/host/fm1tracker.wav
            build/host/fm1tracker_wp3_3_lock_editor-1000.ppm
            build/host/fm1tracker_wp3_3_lock_editor-3000.ppm
