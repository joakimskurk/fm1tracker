name: WP2.5 16-step page input verification (historical)

# WP2.5 is closed and durably verified by run 39994230797 at
# 28d8ac051eb7107e745bb007e1a39014f51c1169. Later Phase 2 packages will
# legitimately extend dinghy.c input behavior, so this package gate is manual-only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified WP2.5 checkpoint
        uses: actions/checkout@v4
        with:
          ref: 28d8ac051eb7107e745bb007e1a39014f51c1169
          fetch-depth: 0

      - name: Explain checkpoint
        run: |
          echo "WP2_5_VERIFIED_COMMIT=28d8ac051eb7107e745bb007e1a39014f51c1169"
          echo "WP2_5_VERIFIED_RUN=39994230797"
          echo "See docs/WP2_5_VERIFICATION.md for durable evidence."
