name: WP4.9 to WP4.10 handoff once

on:
  push:
    branches:
      - phase4/8bit-engine
    paths:
      - .github/tmp/wp4_9_to_wp4_10_handoff.py
      - .github/workflows/_wp4_9_to_wp4_10_handoff_once.yml

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply authoritative WP4.10 handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tmp/wp4_9_to_wp4_10_handoff.py | tee /tmp/wp4_10_handoff.log
          grep -F 'WP4_9_TO_WP4_10_HANDOFF_OK=1' /tmp/wp4_10_handoff.log
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_STATE.md docs/WORK_PACKAGES.md docs/ROADMAP.md docs/TEST_MATRIX.md START_HERE.md
          git commit -m 'docs: hand off Phase 4 to WP4.10'
          git push origin HEAD:phase4/8bit-engine
