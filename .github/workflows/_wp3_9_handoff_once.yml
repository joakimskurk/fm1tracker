name: WP3.9 handoff sync once

on:
  push:
    branches:
      - phase3/plocks-effects
    paths:
      - .github/workflows/_wp3_9_handoff_once.yml
      - .github/tmp/wp3_9_handoff.py

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize WP3.9 closeout and WP3.10 handoff
        run: python3 .github/tmp/wp3_9_handoff.py

      - name: Normalize generated EOF whitespace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CHANGELOG.md')
          p.write_text(p.read_text().rstrip() + '\n')
          PY

      - name: Validate and commit handoff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DECISIONS.md docs/PROJECT_STATE.md docs/WORK_PACKAGES.md docs/ROADMAP.md docs/TEST_MATRIX.md CHANGELOG.md
          git commit -m 'docs: close WP3.9 and hand off to WP3.10'
          git push origin HEAD:phase3/plocks-effects
