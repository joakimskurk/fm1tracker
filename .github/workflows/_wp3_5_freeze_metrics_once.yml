name: WP3.5 freeze measured metrics once

on:
  push:
    branches:
      - phase3/plocks-effects
    paths:
      - .github/workflows/_wp3_5_freeze_metrics_once.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze exact WP3.5 device metrics
        shell: bash
        run: |
          set -euo pipefail
          echo 'ZnJvbSBwYXRobGliIGltcG9ydCBQYXRoCnAgPSBQYXRoKCJ0ZXN0cy9ydW5fd3AzXzVfY2xvc2VvdXRfY2kuc2giKQpzID0gcC5yZWFkX3RleHQoKQpkZWYgb25jZShvbGQsIG5ldyk6CiAgICBnbG9iYWwgcyAgICA7IGM9cy5jb3VudChvbGQpCiAgICBhc3NlcnQgYyA9PSAxLCAob2xkWzoxMDBdLCBjKQogICAgcz1zLnJlcGxhY2Uob2xkLG5ldyw  ' | tr -d ' ' | base64 -d > /tmp/freeze.py
          python3 /tmp/freeze.py
          git diff --check

      - name: Commit frozen closeout assertions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/run_wp3_5_closeout_ci.sh
          git commit -m 'WP3.5: freeze exact device and artifact metrics'
          git push origin HEAD:phase3/plocks-effects
