name: Repair D031 append-only decision history

on:
  push:
    branches:
      - phase3/plocks-effects
    paths:
      - .github/workflows/_repair_decisions_d031.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact D001-D030 and append current D031
        shell: bash
        run: |
          set -euo pipefail
          OLD=7b448004be4dbdc9230528547f0d6bc8b1d6e5ba
          cp docs/DECISIONS.md /tmp/decisions_with_d031.md
          git show "$OLD:docs/DECISIONS.md" > docs/DECISIONS.md
          printf '\n' >> docs/DECISIONS.md
          sed -n '/^## D031 /,$p' /tmp/decisions_with_d031.md >> docs/DECISIONS.md
          git show "$OLD:docs/DECISIONS.md" > /tmp/decisions_old.md
          python3 - <<'PY'
          from pathlib import Path
          old = Path('/tmp/decisions_old.md').read_bytes()
          new = Path('docs/DECISIONS.md').read_bytes()
          assert new.startswith(old), 'D001-D030 prefix changed'
          suffix = new[len(old):]
          assert suffix.startswith(b'\n## D031 '), suffix[:80]
          assert b'## D030 ' in old
          assert b'## D031 ' not in old
          print('DECISIONS_APPEND_ONLY_REPAIRED=1')
          PY

      - name: Commit repaired decision log
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DECISIONS.md
          if git diff --cached --quiet; then
            echo 'No repair needed'
            exit 0
          fi
          git commit -m 'WP3.5: restore exact decision history and append D031'
          git push origin HEAD:phase3/plocks-effects
