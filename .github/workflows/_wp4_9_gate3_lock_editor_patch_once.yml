name: WP4.9 Gate 3 lock editor patch once

on:
  push:
    branches:
      - phase4/8bit-engine
    paths:
      - .github/tmp/wp4_9_gate3_lock_editor_patch.py
      - .github/workflows/_wp4_9_gate3_lock_editor_patch_once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply semantic editor helper
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tmp/wp4_9_gate3_lock_editor_patch.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/src/fmt_lock_editor.c
          git commit -m 'feat: add D045 semantic p-lock mutation path'
          git push origin HEAD:phase4/8bit-engine
