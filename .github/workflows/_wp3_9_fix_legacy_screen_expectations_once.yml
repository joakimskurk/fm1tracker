name: WP3.9 fix legacy screen expectations once

on:
  push:
    branches:
      - phase3/plocks-effects
    paths:
      - .github/workflows/_wp3_9_fix_legacy_screen_expectations_once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update D026 expected text for D035 row extension
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/test_fmt_tracker_screen.c')
          s = p.read_text()
          old1 = 'assert(strcmp(line3, "ST NOTE IN VOL FX") == 0);'
          new1 = 'assert(strcmp(line3, "ST NOTE IN VOL LK FX") == 0);'
          old2 = 'assert(strcmp(row, "25 C#4  05 087 ---") == 0);'
          new2 = 'assert(strcmp(row, "25 C#4  05 087 -- ----") == 0);'
          assert s.count(old1) == 1, 'legacy header expectation not unique'
          assert s.count(old2) == 1, 'legacy row expectation not unique'
          s = s.replace(old1, new1).replace(old2, new2)
          p.write_text(s)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_fmt_tracker_screen.c
          git commit -m 'test: update D026 expectations for D035 fields'
          git push origin HEAD:phase3/plocks-effects
