name: WP5.8 D056 row cache

on:
  push:
    branches:
      - phase5/fm4-parameters
    paths:
      - 'firmware/src/fmt_8bit_linked_params.h'
      - 'firmware/src/fmt_8bit_linked_params.c'
      - 'firmware/src/fmt_fm_linked_params.h'
      - 'firmware/src/fmt_fm_linked_params.c'
      - 'firmware/src/fmt_fm_params.h'
      - 'firmware/src/fmt_fm_params.c'
      - 'tests/test_fmt_fm_row_cache.c'
      - 'tests/run_wp5_8_row_cache_tests.sh'
      - 'tests/run_wp5_8_param_model_tests.sh'
      - '.github/workflows/wp5_8_row_cache.yml'
  workflow_dispatch:

jobs:
  row-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install inherited host dependency
        run: python3 -m pip install pillow
      - name: Verify D056 generalized row cache
        run: sh tests/run_wp5_8_row_cache_tests.sh
      - name: Upload row-cache evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp5-8-row-cache-evidence
          path: build/wp5_8_row_cache
          if-no-files-found: error
