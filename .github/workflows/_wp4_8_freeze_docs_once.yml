name: WP4.8 D044 documentation freeze once

on:
  push:
    branches:
      - phase4/8bit-engine
    paths:
      - .github/workflows/_wp4_8_freeze_docs_once.yml

permissions:
  contents: write

jobs:
  freeze-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize D044 contract status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/WP4_8_PARAMETER_PAGE_CONTRACT.md')
          s = p.read_text()
          old = 'Status: **D044 contract candidate — must be recorded in DECISIONS before production parameter-page source**'
          new = 'Status: **FROZEN BY D044 BEFORE PRODUCTION PARAMETER-PAGE SOURCE**'
          if old in s:
              s = s.replace(old, new, 1)
          assert new in s
          p.write_text(s)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/WP4_8_PARAMETER_PAGE_CONTRACT.md
          if git diff --cached --quiet; then
            echo 'WP4_8_D044_CONTRACT_ALREADY_FROZEN=1'
            exit 0
          fi
          git commit -m 'docs: mark D044 parameter page contract frozen'
          git pull --rebase origin phase4/8bit-engine
          git push origin HEAD:phase4/8bit-engine
          echo 'WP4_8_D044_CONTRACT_STATUS_FROZEN=1'
