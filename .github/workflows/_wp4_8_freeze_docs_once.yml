name: WP4.8 D044 documentation freeze once

on:
  push:
    branches:
      - phase4/8bit-engine
    paths:
      - .github/workflows/_wp4_8_freeze_docs_once.yml
      - .github/tmp/wp4_8_freeze_docs.py

permissions:
  contents: write

jobs:
  freeze-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Freeze D044 across project docs
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tmp/wp4_8_freeze_docs.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/WP4_8_PARAMETER_PAGE_CONTRACT.md docs/DECISIONS.md docs/PROJECT_STATE.md docs/WORK_PACKAGES.md docs/ROADMAP.md docs/TEST_MATRIX.md
          if git diff --cached --quiet; then
            echo 'WP4_8_D044_DOCS_ALREADY_FROZEN=1'
            exit 0
          fi
          git commit -m 'docs: record D044 8-BIT parameter page contract freeze'
          git pull --rebase origin phase4/8bit-engine
          git push origin HEAD:phase4/8bit-engine
