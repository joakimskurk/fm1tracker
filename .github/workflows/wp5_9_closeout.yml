name: WP5.9 mixed validation closeout

on:
  workflow_dispatch:
  push:
    branches:
      - phase5/mixed-validation
    paths:
      - 'firmware/src/dinghy.c'
      - 'tests/run_wp5_9_mixed_validation_tests.sh'
      - 'docs/WP5_9_DEFECT_001_FIX_CONTRACT.md'
      - '.github/workflows/wp5_9_closeout.yml'

permissions:
  contents: read

jobs:
  closeout-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FM1Tracker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install host UI dependency
        run: python3 -m pip install pillow
      - name: Run WP5.9 mixed host gate
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/wp5_9_closeout_host
          mkdir -p "$OUT"
          sh tests/run_wp5_9_mixed_validation_tests.sh > "$OUT/ci.log" 2>&1
          cat "$OUT/ci.log"
          grep -F 'WP5_9_HOST_GATE_OK=1 production_delta=dinghy_fix simultaneous=real saturated_sum=exact switch=real events=covered delayed_bidirectional=1 delayed_unsupported=1 plock_family_safe=exact d056=exact all8bit=wp5_0_identical hardware_margin_claim=none' "$OUT/ci.log"
          printf '%s\n' 'WP5_9_CLOSEOUT_HOST_OK=1 mixed=real delayed_fix=verified bidirectional=1 unsupported=scheduled_fail d056=exact all8bit=wp5_0_identical hardware_margin_claim=none' > "$OUT/summary.txt"
          cat "$OUT/summary.txt"
      - name: Upload WP5.9 host closeout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp5-9-closeout-host
          path: build/wp5_9_closeout_host/
          if-no-files-found: error

  closeout-target:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FM1Tracker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify authorized production boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE=849c8b27d8c1afa09f9c093b695985c64e0c6013
          FIX=bcab28cb8e7f7d774114008eeba54c18837b9bb7
          actual="$(git diff --name-only "$BASE" "$FIX" -- firmware/src firmware/gen tools | sort)"
          test "$actual" = 'firmware/src/dinghy.c'
          git diff --exit-code "$FIX" -- firmware/src firmware/gen tools
          printf '%s\n' 'WP5_9_TARGET_SOURCE_OK=1 base=d056 delta=dinghy_only fix=bcab28cb8e7f7d774114008eeba54c18837b9bb7'
      - name: Install target build UI dependency
        run: python3 -m pip install pillow
      - name: Fetch pinned JieLi toolchain
        shell: bash
        run: |
          set -euo pipefail
          ./tools/get_toolchain.sh "$RUNNER_TEMP/jieli"
          test -x "$RUNNER_TEMP/jieli/toolchain/pi32v2/bin/clang"
          "$RUNNER_TEMP/jieli/toolchain/pi32v2/bin/clang" --version | head -n 2
      - name: Build and verify amended WP5.9 target
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/wp5_9_closeout_target
          mkdir -p "$OUT"
          export JIELI_TOOLCHAIN="$RUNNER_TEMP/jieli/toolchain"
          SDK="$RUNNER_TEMP/ac79-sdk"
          rm -rf "$SDK"
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$SDK"
          ACTUAL_SDK="$(git -C "$SDK" rev-parse HEAD)"
          test "$ACTUAL_SDK" = d179b4484759423312073f5fbb232501aa491047
          export AC79_SDK="$SDK"
          printf 'AC79_SDK_COMMIT=%s\n' "$ACTUAL_SDK" > "$OUT/sdk.txt"

          ./build.sh --release 0.1 > "$OUT/device.log" 2>&1
          cat "$OUT/device.log"
          test -s build/fm1tracker.bin
          test -s build/fm1tracker-0.1.fwsc
          test -s build/fm1tracker.elf
          "$JIELI_TOOLCHAIN/common/bin/objdump" -t build/fm1tracker.elf > "$OUT/symbols.txt"
          grep -F 'fmt_engine_row_param_cache' "$OUT/symbols.txt" > "$OUT/row_cache_symbol.txt"
          grep -F 'fmt_fm_instrument_base' "$OUT/symbols.txt" > "$OUT/fm_base_symbol.txt"
          grep -F 'fmt_fm_engine_runtime' "$OUT/symbols.txt" > "$OUT/fm_engine_symbol.txt"

          python3 - <<'PY' > "$OUT/metrics.txt"
          import hashlib
          import re
          from pathlib import Path

          log = Path('build/wp5_9_closeout_target/device.log').read_text()
          m = re.search(r'image (\d+) B of (\d+); RAM \.data\+\.bss (\d+) B of 98304; pool (\d+) B of 344064', log)
          assert m, log[-4000:]
          image, image_limit, ram, pool = map(int, m.groups())
          d056_image = 79804
          d056_ram = 27792
          d056_pool = 113000
          assert image <= 80828, image
          assert ram == d056_ram, (ram, d056_ram)
          assert pool == d056_pool, (pool, d056_pool)
          assert image - d056_image <= 1024, image - d056_image

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          print('WP5_9_TARGET_FOOTPRINT_OK=1')
          print(f'image_bytes={image}')
          print(f'normal_ram_bytes={ram}')
          print(f'pool_ram_bytes={pool}')
          print(f'image_delta_vs_d056={image-d056_image}')
          print(f'normal_ram_delta_vs_d056={ram-d056_ram}')
          print(f'pool_delta_vs_d056={pool-d056_pool}')
          print(f'image_margin_to_fix_ceiling={80828-image}')
          print(f'normal_ram_margin_to_d056_ceiling={28656-ram}')
          print(f'fm1tracker_bin_sha256={sha("build/fm1tracker.bin")}')
          print(f'fm1tracker_fwsc_sha256={sha("build/fm1tracker-0.1.fwsc")}')
          PY
          cat "$OUT/metrics.txt"

          grep -F 'FM1Tracker package' "$OUT/device.log"
          grep -F 'identity FM-1_987' "$OUT/device.log"
          grep -F 'WP5_9_TARGET_FOOTPRINT_OK=1' "$OUT/metrics.txt"
          printf '%s\n' 'WP5_9_CLOSEOUT_TARGET_OK=1 target=pinned source=dinghy_fix image_ceiling=80828 ram=27792 pool=113000 ram_growth=0 hardware_margin_claim=none' > "$OUT/summary.txt"
          cat "$OUT/summary.txt"
      - name: Upload WP5.9 target closeout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp5-9-closeout-target
          path: build/wp5_9_closeout_target/
          if-no-files-found: error
