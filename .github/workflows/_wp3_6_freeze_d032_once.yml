name: WP3.6 freeze D032 once

on:
  push:
    branches:
      - phase3/plocks-effects
    paths:
      - .github/workflows/_wp3_6_freeze_d032_once.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append D032 and mark package active
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('docs/DECISIONS.md'); s=p.read_text(); assert '## D032 —' not in s; e=Path('docs/_WP3_6_D032_APPEND.tmp.md').read_text(); p.write_text(s.rstrip()+'\n\n'+e.rstrip()+'\n')"
          python3 -c "from pathlib import Path; p=Path('docs/WORK_PACKAGES.md'); s=p.read_text(); old='- **WP3.6 — arpeggio / slide / portamento / vibrato tracker effects** — READY TO START — issue #25.'; new='- **WP3.6 — arpeggio / slide / portamento / vibrato tracker effects** — IN PROGRESS — issue #25.'; assert old in s; p.write_text(s.replace(old,new,1))"
          git diff --check
          echo 'D032_APPEND_AND_PACKAGE_ACTIVE_OK=1'

      - name: Commit decision
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DECISIONS.md docs/WORK_PACKAGES.md
          git commit -m 'docs: freeze D032 tracker effect contract'
          git push origin HEAD:phase3/plocks-effects
