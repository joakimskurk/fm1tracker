name: Phase 3 final handoff sync once

on:
  push:
    branches:
      - phase3/plocks-effects
    paths:
      - .github/workflows/_phase3_final_handoff_once.yml
      - .github/tmp/phase3_final_handoff.py

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize final Phase 3 state
        run: python3 .github/tmp/phase3_final_handoff.py

      - name: Normalize generated handoff whitespace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          fixes = {
              'docs/PROJECT_STATE.md': {
                  'Parent issue: #20 — CLOSED / completed  \n': 'Parent issue: #20 — CLOSED / completed\n',
                  'Evidence: `docs/WP3_10_VERIFICATION.md`  \n': 'Evidence: `docs/WP3_10_VERIFICATION.md`\n',
                  'Phase 4 parent issue: #30  \n': 'Phase 4 parent issue: #30\n',
              },
              'docs/ROADMAP.md': {
                  'Parent issue: #30  \n': 'Parent issue: #30\n',
              },
          }
          for name, replacements in fixes.items():
              p = Path(name)
              s = p.read_text()
              for old, new in replacements.items():
                  assert s.count(old) == 1, (name, old, s.count(old))
                  s = s.replace(old, new, 1)
              p.write_text(s)
          PY

      - name: Validate and commit handoff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DECISIONS.md docs/PROJECT_STATE.md docs/WORK_PACKAGES.md docs/ROADMAP.md docs/TEST_MATRIX.md CHANGELOG.md
          git commit -m 'docs: close Phase 3 and hand off to Phase 4'
          git push origin HEAD:phase3/plocks-effects
