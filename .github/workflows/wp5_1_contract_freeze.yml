name: WP5.1 D049 contract freeze

# D049 gate intentionally installs Pillow because the inherited host runner emits a PNG.
on:
  workflow_dispatch:
  push:
    branches:
      - phase5/fm4-operator
    paths:
      - docs/WP5_1_FM_OPERATOR_CONTRACT.md
      - tests/run_wp5_1_contract_freeze.sh
      - .github/workflows/wp5_1_contract_freeze.yml

jobs:
  contract-freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host UI dependency
        run: python3 -m pip install pillow

      - name: Verify D049 pre-implementation contract and reference vectors
        run: sh tests/run_wp5_1_contract_freeze.sh

      - name: Upload D049 contract-freeze evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp5-1-d049-contract-freeze
          path: |
            docs/WP5_1_FM_OPERATOR_CONTRACT.md
            build/host/fm1tracker.wav
          if-no-files-found: warn
