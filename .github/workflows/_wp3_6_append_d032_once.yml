name: WP3.6 append D032 once

on:
  push:
    branches:
      - phase3/plocks-effects
    paths:
      - .github/workflows/_wp3_6_append_d032_once.yml

permissions:
  contents: write

jobs:
  append-decision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append D032 without rewriting prior decisions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          p = Path('docs/DECISIONS.md')
          before = p.read_bytes()
          text = before.decode('utf-8')
          assert '## D032 —' not in text
          decision = r'''

## D032 — WP3.6 uses five explicit tracker pitch-effect commands on a six-tick D020 phase grid

Date: 2026-10-24  
Status: accepted for the WP3.6 one-lane proof

**Decision:** WP3.6 keeps tracker-effect identity separate from D027 parameter IDs and assigns exactly these `FmtStep.effect` command bytes:

- `0x00` — `FMT_FX_NONE`;
- `0x01` — `FMT_FX_ARPEGGIO`;
- `0x02` — `FMT_FX_SLIDE_UP`;
- `0x03` — `FMT_FX_SLIDE_DOWN`;
- `0x04` — `FMT_FX_PORTAMENTO`;
- `0x05` — `FMT_FX_VIBRATO`.

`0x06..0xFF` remain unassigned by WP3.6. Unknown commands resolve to safe NONE behavior and never alias a D027 p-lock parameter.

The command and its one-byte argument remain in the existing 8-byte `FmtStep.effect` / `FmtStep.effect_value` fields. WP3.6 does not enlarge `FmtStep` and does not assign new p-lock IDs.

### Fixed main-to-audio row publication

`FmtPlaybackEvent` remains exactly 4 bytes and continues to carry only `boundary, step, kind, note`.

WP3.6 adds one separate naturally aligned 32-bit row word for each of the 64 rows on the existing pattern-0 / track-0 proof lane:

- bits `0..7`: validated effect command;
- bits `8..15`: raw `effect_value`;
- bits `16..23`: resolver flags/status for tests/diagnostics;
- bits `24..31`: reserved zero.

The cache is therefore `64 * 4 = 256` bytes of ordinary RAM. Main/startup code publishes complete row words. Audio reads exactly one complete 32-bit effect word at D021 row dispatch. Unknown command IDs publish NONE plus an invalid-command flag. Invalid row coordinates are rejected without publication. No mutable song/list traversal, allocation, retry loop, screen work or flash work is introduced into the ISR.

WP3.6 has no panel effect editor. The proof cache is rebuilt from `FmtStep.effect/effect_value` at startup/tests and exposes a bounded single-row refresh API for later editing packages.

### Six exact effect ticks per row

Tracker effects use exactly six sub-row ticks numbered `0..5`.

D020 already defines one row as exactly `661500` phase units. WP3.6 divides this with no remainder:

`661500 / 6 = 110250`

Tick 0 begins when the D021 row is dispatched. Ticks 1..5 begin at pre-render transport phases:

- tick 1: `110250`;
- tick 2: `220500`;
- tick 3: `330750`;
- tick 4: `441000`;
- tick 5: `551250`.

Audio checks the current D020 phase **before rendering each frame**. If the next threshold has been reached, one effect-tick transition is applied before that frame is rendered. D020 transport still advances after rendering exactly as D021 requires. Because the maximum valid BPM `65535` is smaller than one effect-tick quantum `110250`, at most one effect-tick transition can occur per rendered frame. No division or loop over missed ticks is required in the normal audio path.

Stopping transport freezes effect-tick progress because D020 phase stops. Resuming continues from the same row phase. A row boundary always resets the sub-row tick counter to 0 for the new row.

At 120 BPM the first rendered frames of ticks 1..5 are deterministically 919, 1838, 2757, 3675 and 4594 relative to the row start. The next row still begins at D021's existing exact boundary.

### Common pitch domain and D031 precedence

All four pitch-effect families operate in the same unsigned Q7-semitone domain already produced by D031:

`0 .. 16383 = MIDI 0 .. (127 + 127/128)`

D031 is applied first. Its logical base note plus row-local FINE PITCH produces the row's **base/center pitch**. WP3.6 then applies tracker-effect motion/modulation after that base has been resolved. Effective output pitch is always clamped to `0..16383` before conversion through the existing integer phase-increment path.

VOICE LEVEL and TRACK LEVEL are unaffected by WP3.6. Tracker effects never write p-lock storage or base row data.

WP3.6 distinguishes persistent pitch **center** from transient modulation. ARPEGGIO and VIBRATO never rewrite the persistent center. SLIDE and PORTAMENTO may move the persistent center only under their explicit contiguous-command rules below.

### ARPEGGIO `0x01`

`effect_value` uses two unsigned semitone nibbles:

- high nibble `X = 0..15` semitones;
- low nibble `Y = 0..15` semitones.

The six ticks output:

- ticks 0 and 3: base pitch;
- ticks 1 and 4: base + `X * 128`;
- ticks 2 and 5: base + `Y * 128`.

ARPEGGIO is row-local and has no memory across rows. `0x00` means all six ticks use base pitch. It never changes the persistent center or oscillator phase.

### SLIDE UP `0x02` / SLIDE DOWN `0x03`

For both commands, `effect_value` is an unsigned speed in Q7 pitch units **per effect tick**:

- `1` = `1/128` semitone per tick;
- `255` = `255/128` semitones per tick;
- `0` = no movement on that row.

Tick 0 does not move pitch. Ticks 1..5 add/subtract exactly `effect_value` Q7 units, clamped safely.

A slide offset continues across consecutive rows only when:

- the same slide direction command is present again; and
- the new row event is TIE or EMPTY/NONE, not a new ordinary NOTE.

A new NOTE, opposite slide direction, different effect command, NONE or OFF resets the accumulated slide offset before the new row behavior is applied. D031 FINE PITCH remains row-local underneath the preserved slide offset, so a new row FINE value moves the center while the explicit contiguous slide offset remains additive.

There is no hidden zero-value memory: a repeated slide row with value 0 preserves an already accumulated contiguous offset but adds no further movement.

### PORTAMENTO `0x04`

`effect_value` is the maximum movement toward the target in Q7 pitch units per effect tick, with the same scale as slide. `0` means hold current portamento pitch; it never means reuse an earlier speed.

When an ordinary NOTE + PORTAMENTO arrives while a logical note was already active before the row:

- D031 resolves the new note + FINE value as the portamento target;
- the persistent pitch center starts from the previous row's persistent center, excluding transient ARPEGGIO/VIBRATO offset;
- there is no immediate jump to the target on tick 0;
- ticks 1..5 move toward the target by `min(speed, remaining_distance)` with no overshoot;
- oscillator phase is not reset by the effect.

If no logical note was active before NOTE + PORTAMENTO, the new note starts directly at its D031 target pitch; there is nothing to glide from.

A consecutive PORTAMENTO row with TIE or EMPTY/NONE continues from the previous current center toward that row's current D031 base target. This lets row-local FINE PITCH adjust the target deterministically. A first PORTAMENTO TIE/EMPTY without a valid preceding portamento target starts at base pitch and has no distance to travel.

Any non-PORTAMENTO row clears portamento continuation and uses that row's D031 base center immediately. OFF clears portamento state and cannot be resurrected by later TIE/EMPTY rows.

### VIBRATO `0x05`

`effect_value` is split into two nibbles:

- high nibble `S = 0..15`: phase advance per effect tick on a 64-position triangle cycle;
- low nibble `D = 0..15`: depth in `1/16` semitone units, so `depth_q7 = D * 8` and max depth is `15/16` semitone.

The triangle phase is `0..63`. The integer triangle has zero at phase 0/32, positive peak at 16 and negative peak at 48. Modulation is the triangle fraction multiplied by `depth_q7` using bounded integer multiply/shift only.

On the first VIBRATO row, or on any ordinary NOTE row carrying VIBRATO, phase resets to 0. Consecutive VIBRATO rows containing TIE or EMPTY/NONE preserve phase. Any different command/NONE/OFF resets vibrato phase for the next use.

Tick 0 uses the current phase without advance. Ticks 1..5 first advance phase by `S` modulo 64, then apply modulation around the current D031 base center. `S=0` means no phase advance; `D=0` means zero modulation. No prior speed/depth value is remembered implicitly.

VIBRATO is transient and never changes the persistent pitch center.

### NOTE / TIE / EMPTY / OFF interaction

D025/D031 logical note state remains authoritative.

- NOTE establishes the new D031 base note/FINE center first, except that active-note PORTAMENTO deliberately preserves the previous persistent center as the glide start.
- TIE and EMPTY/NONE may run ARPEGGIO, SLIDE, PORTAMENTO or VIBRATO only while a logical note remains active. They never resurrect an OFF'd voice.
- OFF immediately clears tracker-effect continuation state and keeps the existing click-safe release semantics. Effect commands on an OFF row cannot retune, reopen or resurrect the voice.
- A level-zero D031 row can mute a logically active note while pitch-effect state continues deterministically; a later unlocked level row may restore audibility exactly as D031 specifies.

No tracker effect changes the D025 note sentinel encoding.

### Explicit effect memory policy

There is **no implicit argument memory** in WP3.6. `effect_value=0` always means numeric zero for that row.

Only the minimal pitch state explicitly described above may continue:

- same-direction SLIDE on consecutive TIE/EMPTY rows may retain accumulated slide offset;
- PORTAMENTO on consecutive rows may retain current center/target continuation;
- VIBRATO on consecutive TIE/EMPTY rows may retain phase;
- ARPEGGIO retains nothing across rows.

Changing command, NONE, new-note reset rules or OFF clears the corresponding continuation state exactly as specified. This avoids inheriting Furnace/ProTracker zero-argument memory accidentally.

### Hard real-time bounds and regression rule

Per row, main/startup resolver work is one fixed `FmtStep` read and one validated 32-bit cache publication. There is no effect list or allocator.

At audio row dispatch, work is one fixed 32-bit effect-cache read plus fixed state initialization. Per rendered frame, inactive/NONE effect work is a constant quick check. An active effect performs one threshold compare; at most once per frame it performs one bounded tick-state update and pitch conversion. There is no unbounded loop, allocation, mutable list traversal, screen work, flash access, float or runtime 64-bit division.

The existing no-effect proof pattern must remain byte-identical to the historical default WAV:

`453dc6b7a2f06a24b1a236ecd692b9beca59f8a070fdc954c4ea1c79c0e13440`

The existing D031 p-lock-only locked fixture must also remain byte-identical because it contains no tracker effects:

`8d2e478e366c0af18b0631da268ba75cc358157d043c567bee2e734852d0e9a8`

WP3.6 adds separate deterministic fixtures for ARPEGGIO, both slide directions, PORTAMENTO and VIBRATO, including D031 FINE precedence, continuation/reset rules, OFF non-resurrection and exact six-tick boundaries.

**Reason:** the already-frozen two-byte tracker-effect slot is enough for the first classic pitch-effect family. Six ticks fit D020's exact phase domain without remainder and provide tracker-like sub-row behavior without a second clock or the WP3.8 queue. Explicit zero semantics avoid hidden historical-format assumptions. A separate atomic row cache preserves the D031 real-time ownership model and keeps the 4-byte D021 event stable.

**Consequence:** WP3.6 must add a small effect command/cache/state module and focused tests before audio integration. `FmtStep` and `FmtPlaybackEvent` sizes remain frozen. All Phase 2 and WP3.1-WP3.5 regressions remain required. WP3.7 retrig/note-delay/note-cut, WP3.8 queue/overflow architecture, WP3.9 full effect visualization and final physical effect ergonomics remain out of scope.
'''
          after = before + decision.encode('utf-8')
          assert after[:len(before)] == before
          p.write_bytes(after)
          print('D032_PREFIX_SHA256=' + hashlib.sha256(before).hexdigest())
          print('D032_APPENDED=1')
          PY
          git diff --check

      - name: Commit D032
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DECISIONS.md
          git commit -m 'D032: freeze six-tick tracker pitch effects'
          git push origin HEAD:phase3/plocks-effects
