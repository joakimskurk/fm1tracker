name: WP4.9 Gate 5 detailed host probe once

on:
  push:
    branches:
      - phase4/8bit-engine
    paths:
      - .github/tmp/wp4_9_gate5_probe_detail.py
      - .github/workflows/_wp4_9_gate5_probe_detail_once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply detailed read-only Gate 5 host probe
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tmp/wp4_9_gate5_probe_detail.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/host.c
          git commit -m 'test: extend D045 host state probe detail'
          git push origin HEAD:phase4/8bit-engine
