name: WP4.10 D046 host digest residual fix once

on:
  push:
    branches:
      - phase4/8bit-engine
    paths:
      - .github/workflows/_wp4_10_host_residual_fix_once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove nonexistent transport residual from host-only digest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/host.c')
          s = p.read_text()
          old = '    hash = host_fnv_u32(hash, fmt_transport_runtime.residual);\n'
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, '', 1))
          PY
          git diff --check
          git diff --exit-code c93c39ad344760b4da0dfbc76829ca5fef886174 -- firmware/src firmware/hal firmware/loader firmware/app.ld build.sh tools
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/host.c
          git commit -m 'test: fix D046 host transport digest'
          git push origin HEAD:phase4/8bit-engine
