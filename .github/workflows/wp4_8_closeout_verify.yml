# Permanent WP4.8 closeout gate; keep after package completion.
name: WP4.8 D044 parameter-page closeout verification

on:
  push:
    branches:
      - phase4/8bit-engine
    paths:
      - tests/run_wp4_8_closeout_ci.sh
      - .github/workflows/wp4_8_closeout_verify.yml
      - firmware/src/fmt_8bit_params.h
      - firmware/src/fmt_8bit_params.c
      - tests/test_wp4_8_8bit_params.c
      - tests/run_wp4_8_8bit_params_tests.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wp4-8-closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FM1Tracker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install inherited host screenshot dependency
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Run D044 isolated parameter closeout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          sh tests/run_wp4_8_closeout_ci.sh | tee build/wp4_8_closeout.log
          grep -F 'WP4_8_ISOLATED_PRODUCTION_DELTA_OK=1' build/wp4_8_closeout.log
          grep -F 'WP4_8_TARGET_OBJECT_OK=1' build/wp4_8_closeout.log
          grep -F 'WP4_8_DEVICE_BASELINE' build/wp4_8_closeout.log
          grep -F 'WP4_8_D044_EXIT_OK=1' build/wp4_8_closeout.log
          grep -F 'WP4_8_CLOSEOUT_OK=1' build/wp4_8_closeout.log

      - name: Upload WP4.8 closeout evidence
        uses: actions/upload-artifact@v4
        with:
          name: wp4-8-d044-closeout-evidence
          if-no-files-found: warn
          path: |
            build/wp4_8_*.log
            build/wp4_8_*.txt
            build/wp4_8_target/
            build/fm1tracker.bin
            build/fm1tracker-0.1.fwsc
            build/host/fm1tracker.wav
