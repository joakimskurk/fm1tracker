name: WP4.9 D045 documentation freeze once

on:
  push:
    branches:
      - phase4/8bit-engine
    paths:
      - .github/workflows/_wp4_9_freeze_docs_once.yml
      - .github/tmp/wp4_9_freeze_docs.py

permissions:
  contents: write

jobs:
  freeze-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Freeze D045 across project docs
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tmp/wp4_9_freeze_docs.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DECISIONS.md docs/PROJECT_STATE.md docs/WORK_PACKAGES.md docs/ROADMAP.md docs/TEST_MATRIX.md
          git commit -m 'docs: record D045 linked engine contract freeze'
          git push origin HEAD:phase4/8bit-engine
