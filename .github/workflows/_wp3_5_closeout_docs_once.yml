name: WP3.5 closeout docs once

on:
  push:
    branches:
      - phase3/plocks-effects
    paths:
      - .github/workflows/_wp3_5_closeout_docs_once.yml

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize WP3.5 closeout docs
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/closeout_docs.py
          python3 /tmp/closeout_docs.py
          git diff --check

      - name: Commit synchronized docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/WORK_PACKAGES.md docs/ROADMAP.md docs/TEST_MATRIX.md docs/CONTROL_MAP_V0.1.md CHANGELOG.md
          git commit -m 'docs: synchronize WP3.5 closeout and WP3.6 handoff'
          git push origin HEAD:phase3/plocks-effects
