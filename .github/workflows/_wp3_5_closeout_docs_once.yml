name: WP3.5 closeout docs once

on:
  push:
    branches:
      - phase3/plocks-effects
    paths:
      - .github/workflows/_wp3_5_closeout_docs_once.yml

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize WP3.5 closeout docs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import re
          import subprocess

          previous = subprocess.check_output(
              ['git', 'show', 'HEAD^:.github/workflows/_wp3_5_closeout_docs_once.yml'],
              text=True,
          )
          match = re.search(
              r"echo '([^']+)' \| base64 -d \| gzip -d > /tmp/closeout_docs\.py",
              previous,
          )
          assert match, 'previous closeout payload not found'
          payload = gzip.decompress(base64.b64decode(match.group(1))).decode('utf-8')
          exec(compile(payload, '/tmp/closeout_docs.py', 'exec'), {})

          p = Path('docs/WORK_PACKAGES.md')
          lines = p.read_text().splitlines(keepends=True)
          fixed = []
          for line in lines:
              if ('WP3.5' in line and 'issue #24' in line) or ('WP3.6' in line and 'issue #25' in line):
                  newline = '\n' if line.endswith('\n') else ''
                  line = line.rstrip() + newline
              fixed.append(line)
          p.write_text(''.join(fixed))
          print('WP3_5_CLOSEOUT_DOCS_PATCHED=1')
          PY
          git diff --check

      - name: Commit synchronized docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/WORK_PACKAGES.md docs/ROADMAP.md docs/TEST_MATRIX.md docs/CONTROL_MAP_V0.1.md CHANGELOG.md
          git diff --cached --quiet && { echo 'no documentation changes to commit'; exit 1; }
          git commit -m 'docs: close WP3.5 and hand off to WP3.6'
          git push origin HEAD:phase3/plocks-effects
