name: WP4.9 Gate 6 UI adapter once

on:
  push:
    branches:
      - phase4/8bit-engine
    paths:
      - .github/tmp/wp4_9_gate6_ui_adapter.py
      - .github/workflows/_wp4_9_gate6_ui_adapter_once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Switch Gate 6 to D044-aware UI adapter
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tmp/wp4_9_gate6_ui_adapter.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/run_wp4_9_inherited_regressions.sh
          git commit -m 'test: use D044-aware UI regressions in Gate 6'
          git push origin HEAD:phase4/8bit-engine
