name: WP3.8 closeout dispatch once

on:
  push:
    branches:
      - phase3/plocks-effects
    paths:
      - .github/workflows/_wp3_8_closeout_paths_once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch-closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch permanent WP3.8 closeout on current branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run wp3_8_closeout_verify.yml \
            --repo joakimskurk/fm1tracker \
            --ref phase3/plocks-effects
          echo 'WP3_8_CLOSEOUT_DISPATCHED=1'
