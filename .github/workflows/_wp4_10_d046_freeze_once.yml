name: WP4.10 D046 decision freeze once

on:
  push:
    branches:
      - phase4/8bit-engine
    paths:
      - .github/tmp/wp4_10_d046_freeze.py
      - .github/workflows/_wp4_10_d046_freeze_once.yml

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Freeze D046 in authoritative project state
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tmp/wp4_10_d046_freeze.py | tee /tmp/wp4_10_d046_freeze.log
          grep -F 'WP4_10_D046_FREEZE_OK=1' /tmp/wp4_10_d046_freeze.log
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DECISIONS.md docs/PROJECT_STATE.md docs/WORK_PACKAGES.md docs/ROADMAP.md docs/TEST_MATRIX.md START_HERE.md
          git commit -m 'docs: freeze D046 Phase 4 exit benchmark'
          git push origin HEAD:phase4/8bit-engine
