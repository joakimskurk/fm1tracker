name: WP4.9 Gate 2 to Gate 3 state handoff once

on:
  push:
    branches:
      - phase4/8bit-engine
    paths:
      - .github/tmp/wp4_9_gate2_to_gate3_state.py
      - .github/workflows/_wp4_9_gate2_to_gate3_state_once.yml

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mark Gate 2 green and Gate 3 active
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tmp/wp4_9_gate2_to_gate3_state.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_STATE.md docs/WORK_PACKAGES.md docs/ROADMAP.md docs/TEST_MATRIX.md
          git commit -m 'docs: mark D045 Gate 2 green and activate Gate 3'
          git push origin HEAD:phase4/8bit-engine
