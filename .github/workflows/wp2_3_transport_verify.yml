name: WP2.3 integer transport clock verification

on:
  push:
    branches:
      - phase2/tracker-core
    paths:
      - .github/workflows/wp2_3_transport_verify.yml
      - firmware/src/fmt_transport.h
      - firmware/src/fmt_transport.c
      - firmware/src/dinghy.c
      - tests/test_fmt_transport.c
      - tests/run_transport_tests.sh
      - tests/test_fmt_store.c
      - tests/run_store_tests.sh
      - tests/test_fmt_model.c
      - tests/run_model_tests.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integer-transport:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FM1Tracker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host dependency
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Verify WP2.3 scope boundary
        shell: bash
        run: |
          set -euo pipefail
          base=5d8fd495bdb4877cb15670801a86610ac18d7eaa

          git diff --exit-code "$base" -- \
            firmware/app.ld \
            firmware/src/platform.c \
            firmware/src/fmt_model.h \
            firmware/src/fmt_store.h \
            firmware/src/fmt_store.c \
            firmware/hal \
            firmware/loader \
            tools/build.py \
            tools/fm1pkg_make.py \
            tools/fm1_install.py \
            tools/build_fm1tracker.py

          git diff "$base" -- firmware/src/dinghy.c | grep -F '+#include "fmt_transport.c"'
          git diff "$base" -- firmware/src/dinghy.c | grep -F '+FmtTransport fmt_transport_runtime;'
          git diff "$base" -- firmware/src/dinghy.c | grep -F '+    (void)fmt_transport_advance(&fmt_transport_runtime, n);'
          git diff "$base" -- firmware/src/dinghy.c | grep -F '+    fmt_transport_reset(&fmt_transport_runtime);'
          ! grep -F 'fmt_transport_start(&fmt_transport_runtime)' firmware/src/dinghy.c

          ! grep -E '\b(uint64_t|int64_t|float|double)\b' firmware/src/fmt_transport.h firmware/src/fmt_transport.c
          echo "WP2_3_SCOPE_BOUNDARY_OK=1"

      - name: Run frozen model tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          sh tests/run_model_tests.sh | tee build/wp2_3_model_tests.log
          grep -F "FMT_MODEL_TESTS_OK=1" build/wp2_3_model_tests.log

      - name: Run frozen pattern store tests
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_store_tests.sh | tee build/wp2_3_store_tests.log
          grep -F "FMT_STORE_TESTS_OK=1" build/wp2_3_store_tests.log
          grep -F "steps=8192" build/wp2_3_store_tests.log

      - name: Run integer transport tests
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_transport_tests.sh | tee build/wp2_3_transport_tests.log
          grep -F "FMT_TRANSPORT_TESTS_OK=1" build/wp2_3_transport_tests.log
          grep -F "phase_per_step=661500" build/wp2_3_transport_tests.log
          grep -F "default_bpm=120" build/wp2_3_transport_tests.log
          grep -F "state_bytes=8" build/wp2_3_transport_tests.log
          grep -F "long_run_hours=6" build/wp2_3_transport_tests.log

      - name: Verify host audio regression
        shell: bash
        run: |
          set -euo pipefail
          ./tests/run_host.sh
          test -s build/host/fm1tracker.wav
          test "$(sha256sum build/host/fm1tracker.wav | awk '{print $1}')" = \
            "dac1695b8e69f26334d548005e6cae505cf39ace297dcf6a57338e70fc386b9b"
          strings build/host/fm1tracker | grep -F "FM1TRACKER"
          echo "HOST_AUDIO_UNCHANGED=1"

      - name: Install pinned JieLi toolchain
        shell: bash
        run: |
          set -euo pipefail
          ./tools/get_toolchain.sh "$RUNNER_TEMP/jieli"
          test -x "$RUNNER_TEMP/jieli/toolchain/pi32v2/bin/clang"
          "$RUNNER_TEMP/jieli/toolchain/pi32v2/bin/clang" --version | head -n 2

      - name: Checkout exact official JieLi AC79 SDK release
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/ac79-sdk"
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$sdk"
          actual="$(git -C "$sdk" rev-parse HEAD)"
          echo "AC79_SDK_COMMIT=$actual"
          test "$actual" = "d179b4484759423312073f5fbb232501aa491047"
          test "$(sha256sum "$sdk/cpu/wl82/tools/uboot.boot" | awk '{print $1}')" = \
            "4e3b4c220dc96641cb5a723f41e68ce41d5261ae9434bb33fbd7f2c59976ded4"
          test "$(sha256sum "$sdk/cpu/wl82/tools/cfg_tool.bin" | awk '{print $1}')" = \
            "276579954f076886a6a7694f65dc71c034a63a2c204b76749065c0ac7b010d1b"
          test "$(sha256sum "$sdk/cpu/wl82/tools/cfg/eq_cfg_hw.bin" | awk '{print $1}')" = \
            "41167491bffed4651750719c973d2758adeb9021a5670d02d6a53c85ed80ea7d"
          echo "AC79_SDK_INPUTS_OK=1"

      - name: Build WP2.3 device package
        shell: bash
        run: |
          set -euo pipefail
          JIELI_TOOLCHAIN="$RUNNER_TEMP/jieli/toolchain" \
          AC79_SDK="$RUNNER_TEMP/ac79-sdk" \
          ./build.sh --release 0.1 | tee build/wp2_3_device_build.log

      - name: Capture linked state symbols
        shell: bash
        run: |
          set -euo pipefail
          test -s build/fm1tracker.elf
          "$RUNNER_TEMP/jieli/toolchain/common/bin/objdump" -t build/fm1tracker.elf > build/wp2_3_symbols.txt
          grep -E 'fmt_store_storage$' build/wp2_3_symbols.txt | tee build/wp2_3_store_symbol.txt
          grep -E 'fmt_transport_runtime$' build/wp2_3_symbols.txt | tee build/wp2_3_transport_symbol.txt
          grep -E 'fmt_store_storage$' build/wp2_3_symbols.txt | grep -F '.pool'
          grep -E 'fmt_transport_runtime$' build/wp2_3_symbols.txt | grep -F '.bss'

      - name: Verify identity, preserved store, safety and budgets
        shell: bash
        run: |
          set -euo pipefail
          test -s build/fm1tracker.bin
          test -s build/fm1tracker-0.1.fwsc
          grep -F "register access: hal/ only (src/, loader/ clean)" build/wp2_3_device_build.log
          grep -E "image [0-9]+ B of [0-9]+; RAM \.data\+\.bss [0-9]+ B of 98304; pool [0-9]+ B of 344064" \
            build/wp2_3_device_build.log

          PYTHONPATH=tools python3 - <<'PY'
          from pathlib import Path
          from fm1_install import product_of
          raw = Path("build/fm1tracker-0.1.fwsc").read_bytes()
          product = product_of(raw)
          assert product == "FM-1_987", product
          print("PACKAGE_IDENTITY=" + product)
          PY

          python3 - <<'PY' | tee build/wp2_3_metrics.txt
          import hashlib
          import os
          import re
          from pathlib import Path

          build_log = Path("build/wp2_3_device_build.log").read_text()
          m = re.search(r"image (\d+) B of (\d+); RAM \.data\+\.bss (\d+) B of 98304; pool (\d+) B of 344064", build_log)
          assert m, "resource line not found"
          image, image_limit, ram, pool = map(int, m.groups())

          base_image, base_ram, base_pool = 55188, 12368, 96616

          symbols = Path("build/wp2_3_symbols.txt").read_text().splitlines()
          store_lines = [line for line in symbols if line.rstrip().endswith("fmt_store_storage")]
          transport_lines = [line for line in symbols if line.rstrip().endswith("fmt_transport_runtime")]
          assert len(store_lines) == 1, store_lines
          assert len(transport_lines) == 1, transport_lines

          store_fields = store_lines[0].split()
          transport_fields = transport_lines[0].split()
          assert ".pool" in store_fields, store_lines[0]
          assert ".bss" in transport_fields, transport_lines[0]

          store_address = int(store_fields[0], 16)
          store_size = int(store_fields[-2], 16)
          transport_address = int(transport_fields[0], 16)
          transport_size = int(transport_fields[-2], 16)

          assert store_address == 0x01C20000, hex(store_address)
          assert store_size == 65896, store_size
          assert transport_size == 8, transport_size
          assert 0x01C08000 <= transport_address < 0x01C20000, hex(transport_address)
          assert pool == base_pool, (pool, base_pool)
          assert ram >= base_ram + transport_size, (ram, base_ram, transport_size)
          assert ram - base_ram <= 64, (ram, base_ram)
          assert image >= base_image
          assert image - base_image <= 4096, (image, base_image)

          bin_bytes = Path("build/fm1tracker.bin").read_bytes()
          pkg_bytes = Path("build/fm1tracker-0.1.fwsc").read_bytes()
          wav_bytes = Path("build/host/fm1tracker.wav").read_bytes()

          print("WP2.3 integer transport metrics")
          print(f"commit={os.environ['GITHUB_SHA']}")
          print(f"image_bytes={image}")
          print(f"image_limit_bytes={image_limit}")
          print(f"image_delta_bytes={image - base_image}")
          print(f"normal_ram_bytes={ram}")
          print(f"normal_ram_delta_bytes={ram - base_ram}")
          print(f"pool_ram_bytes={pool}")
          print(f"pool_ram_delta_bytes={pool - base_pool}")
          print(f"transport_state_bytes={transport_size}")
          print(f"transport_state_address=0x{transport_address:08x}")
          print(f"store_address=0x{store_address:08x}")
          print(f"store_bytes={store_size}")
          print("phase_per_step=661500")
          print("default_bpm=120")
          print(f"fm1tracker_bin_sha256={hashlib.sha256(bin_bytes).hexdigest()}")
          print(f"fm1tracker_fwsc_sha256={hashlib.sha256(pkg_bytes).hexdigest()}")
          print(f"host_wav_sha256={hashlib.sha256(wav_bytes).hexdigest()}")
          PY

          grep -F "pool_ram_delta_bytes=0" build/wp2_3_metrics.txt
          grep -F "transport_state_bytes=8" build/wp2_3_metrics.txt
          grep -F "phase_per_step=661500" build/wp2_3_metrics.txt
          echo "WP2_3_TRANSPORT_TIMING_AND_BUDGET_OK=1"

      - name: Upload WP2.3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: wp2-3-integer-transport-evidence
          path: |
            build/wp2_3_model_tests.log
            build/wp2_3_store_tests.log
            build/wp2_3_transport_tests.log
            build/wp2_3_device_build.log
            build/wp2_3_symbols.txt
            build/wp2_3_store_symbol.txt
            build/wp2_3_transport_symbol.txt
            build/wp2_3_metrics.txt
            build/fm1tracker.bin
            build/fm1tracker-0.1.fwsc
            build/host/fm1tracker.wav
            build/host/fm1tracker-*.png
          if-no-files-found: error
          retention-days: 14
