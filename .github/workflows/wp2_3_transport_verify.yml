name: WP2.3 integer transport clock verification (historical)

# WP2.3 is closed and durably verified by run 39988630290 at
# c83ee9cd835503eb410dd8110c2049351a645578. Later Phase 2 packages will
# legitimately extend playback in dinghy.c, so this package gate is manual-only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified WP2.3 checkpoint
        uses: actions/checkout@v4
        with:
          ref: c83ee9cd835503eb410dd8110c2049351a645578
          fetch-depth: 0

      - name: Explain checkpoint
        run: |
          echo "WP2_3_VERIFIED_COMMIT=c83ee9cd835503eb410dd8110c2049351a645578"
          echo "WP2_3_VERIFIED_RUN=39988630290"
          echo "See docs/WP2_3_VERIFICATION.md for durable evidence."
