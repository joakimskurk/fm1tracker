name: Phase 4 branch start sync once

on:
  push:
    branches:
      - phase4/8bit-engine
    paths:
      - .github/workflows/_phase4_branch_start_once.yml
      - .github/tmp/phase4_branch_start.py

permissions:
  contents: write

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize Phase 4 branch start
        run: python3 .github/tmp/phase4_branch_start.py

      - name: Validate and commit branch state
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_STATE.md docs/WORK_PACKAGES.md docs/ROADMAP.md
          git commit -m 'docs: start Phase 4 WP4.1 architecture'
          git push origin HEAD:phase4/8bit-engine
