name: WP4.9 Gate 4 null-pointer hygiene once

on:
  push:
    branches:
      - phase4/8bit-engine
    paths:
      - .github/tmp/wp4_9_gate4_null_hygiene.py
      - .github/workflows/_wp4_9_gate4_null_hygiene_once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply null-pointer hygiene fix
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tmp/wp4_9_gate4_null_hygiene.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/src/fmt_playback_params.c firmware/src/fmt_tracker_effect.c
          git commit -m 'fix: satisfy source hygiene for track-aware cache helpers'
          git push origin HEAD:phase4/8bit-engine
