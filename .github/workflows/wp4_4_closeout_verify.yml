name: WP4.4 TRIANGLE closeout verification

on:
  push:
    branches:
      - phase4/8bit-engine
    paths:
      - firmware/src/fmt_osc_triangle.h
      - firmware/src/fmt_osc_triangle.c
      - tests/test_wp4_4_triangle.c
      - tests/run_wp4_4_triangle_tests.sh
      - tests/run_wp4_4_closeout_ci.sh
      - .github/workflows/wp4_4_closeout_verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wp4-4-closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FM1Tracker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install inherited host screenshot dependency
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Run D040 isolated TRIANGLE closeout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          sh tests/run_wp4_4_closeout_ci.sh | tee build/wp4_4_closeout.log
          grep -F 'WP4_4_ISOLATED_PRODUCTION_DELTA_OK=1' build/wp4_4_closeout.log
          grep -F 'WP4_4_TARGET_OBJECTS_OK=1' build/wp4_4_closeout.log
          grep -F 'WP4_4_DEVICE_BASELINE' build/wp4_4_closeout.log
          grep -F 'WP4_4_D040_EXIT_OK=1' build/wp4_4_closeout.log
          grep -F 'WP4_4_CLOSEOUT_OK=1' build/wp4_4_closeout.log

      - name: Upload WP4.4 closeout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp4-4-triangle-closeout-evidence
          if-no-files-found: warn
          path: |
            build/wp4_4_*.log
            build/wp4_4_*.txt
            build/wp4_4_target/
            build/fm1tracker.bin
            build/fm1tracker-0.1.fwsc
            build/host/fm1tracker.wav
