name: WP4.9 D045 Gate 4 dinghy migration once

on:
  push:
    branches:
      - phase4/8bit-engine
    paths:
      - .github/tmp/wp4_9_gate4_dinghy_migration.py
      - .github/workflows/_wp4_9_gate4_dinghy_migration_once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply D045 Gate 4 migration
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tmp/wp4_9_gate4_dinghy_migration.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add firmware/src/dinghy.c
          git commit -m 'feat: migrate tracker lane to linked 8-BIT engine'
          git push origin HEAD:phase4/8bit-engine
