name: WP3.8 full closeout verification
# Final clean-tree gate after one-shot workflow cleanup.

on:
  push:
    branches:
      - phase3/plocks-effects
    paths:
      - firmware/src/fmt_rt_queue.h
      - firmware/src/fmt_rt_queue.c
      - firmware/hal/fm1_barrier.h
      - firmware/src/dinghy.c
      - tests/test_fmt_rt_queue.c
      - tests/run_rt_queue_tests.sh
      - tests/run_wp3_8_queue_audio_host.sh
      - tests/run_wp3_8_closeout_ci.sh
      - .github/workflows/wp3_8_closeout_verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-queue-closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FM1Tracker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host screenshot dependency
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Run permanent WP3.8 closeout gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          sh tests/run_wp3_8_closeout_ci.sh | tee build/wp3_8_closeout.log
          grep -F 'WP3_8_HAL_BOUNDARY_OK=1 only_new_hal=fm1_barrier.h' build/wp3_8_closeout.log
          grep -F 'WP3_8_CLOSEOUT_OK=1' build/wp3_8_closeout.log

      - name: Upload WP3.8 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp3-8-runtime-queue-evidence
          if-no-files-found: warn
          path: |
            build/wp3_8_*.log
            build/wp3_8_*.txt
            build/wp3_8_*.o
            build/wp3_5_device_build.log
            build/wp3_5_symbols.txt
            build/fm1tracker.bin
            build/fm1tracker-0.1.fwsc
            build/host/fm1tracker.wav
            build/host/fm1tracker_wp3_5_locked.wav
            build/host/fm1tracker_wp3_6_*.wav
            build/host/fm1tracker_wp3_7_*.wav
            build/host/fm1tracker_wp3_8_*.wav
