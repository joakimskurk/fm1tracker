name: WP2.8 special-event semantics verification (historical)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified WP2.8 checkpoint
        uses: actions/checkout@v4
        with:
          ref: c66405bead1c79fd891cf0d12c8bd241019a7aaf

      - name: Identify frozen evidence
        run: |
          test "$(git rev-parse HEAD)" = "c66405bead1c79fd891cf0d12c8bd241019a7aaf"
          echo "WP2.8 verified by Actions run 40004436981, job 120588627172"
          echo "Durable evidence: docs/WP2_8_VERIFICATION.md"
