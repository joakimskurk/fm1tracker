name: WP2.8 special-event semantics verification

on:
  push:
    branches:
      - phase2/tracker-core
    paths:
      - .github/workflows/wp2_8_special_events_verify.yml
      - firmware/src/fmt_step_record.h
      - firmware/src/fmt_step_record.c
      - firmware/src/fmt_playback.h
      - firmware/src/fmt_playback.c
      - firmware/src/dinghy.c
      - tests/host.c
      - tests/test_fmt_step_record.c
      - tests/run_step_record_tests.sh
      - tests/test_fmt_playback.c
      - tests/run_playback_tests.sh
      - tests/wp2_8_special_events_context.script
      - tests/run_special_events_context_host.sh
      - tests/wp2_7_step_rec_context.script
      - tests/run_step_rec_context_host.sh
      - tests/wp2_6_track_context.script
      - tests/run_track_selection_context_host.sh
      - tests/wp2_5_pattern_context.script
      - tests/run_pattern_context_host.sh
      - tests/test_fmt_pattern_input.c
      - tests/run_pattern_input_tests.sh
      - tests/test_fmt_transport.c
      - tests/run_transport_tests.sh
      - tests/test_fmt_store.c
      - tests/run_store_tests.sh
      - tests/test_fmt_model.c
      - tests/run_model_tests.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  special-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FM1Tracker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host dependency
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Verify WP2.8 scope boundary
        shell: bash
        run: |
          set -euo pipefail
          base=13c0748dd696e4f3a47279d00641068b5e915e46

          git diff --exit-code "$base" -- \
            firmware/app.ld \
            firmware/src/platform.c \
            firmware/src/fmt_model.h \
            firmware/src/fmt_store.h \
            firmware/src/fmt_store.c \
            firmware/src/fmt_transport.h \
            firmware/src/fmt_transport.c \
            firmware/src/fmt_pattern_input.h \
            firmware/src/fmt_pattern_input.c \
            firmware/hal \
            firmware/loader \
            tools/build.py \
            tools/fm1pkg_make.py \
            tools/fm1_install.py \
            tools/build_fm1tracker.py

          ! grep -E '\b(uint64_t|int64_t|float|double)\b' \
            firmware/src/fmt_step_record.h firmware/src/fmt_step_record.c \
            firmware/src/fmt_playback.h firmware/src/fmt_playback.c
          grep -F 'uint8_t fx_pending;' firmware/src/fmt_step_record.h
          grep -F 'FMT_PLAYBACK_EVENT_NONE = 0u' firmware/src/fmt_playback.h
          grep -F 'FMT_PLAYBACK_EVENT_NOTE = 1u' firmware/src/fmt_playback.h
          grep -F 'FMT_PLAYBACK_EVENT_TIE  = 2u' firmware/src/fmt_playback.h
          grep -F 'FMT_PLAYBACK_EVENT_OFF  = 3u' firmware/src/fmt_playback.h
          grep -F 'fmt_step_record_write_special' firmware/src/fmt_step_record.h
          grep -F 'fmt_step_record_special_input' firmware/src/fmt_step_record.h
          echo "WP2_8_SCOPE_BOUNDARY_OK=1"

      - name: Run frozen compile-time model tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          sh tests/run_model_tests.sh | tee build/wp2_8_model_tests.log
          grep -F "FMT_MODEL_TESTS_OK=1" build/wp2_8_model_tests.log

      - name: Run frozen pattern store tests
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_store_tests.sh | tee build/wp2_8_store_tests.log
          grep -F "FMT_STORE_TESTS_OK=1" build/wp2_8_store_tests.log

      - name: Run frozen integer transport tests
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_transport_tests.sh | tee build/wp2_8_transport_tests.log
          grep -F "FMT_TRANSPORT_TESTS_OK=1" build/wp2_8_transport_tests.log

      - name: Run page and track input regression tests
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_pattern_input_tests.sh | tee build/wp2_8_pattern_input_tests.log
          grep -F "FMT_PATTERN_INPUT_TESTS_OK=1" build/wp2_8_pattern_input_tests.log
          grep -F "state_bytes=4 pages=4 steps_per_page=16 total_steps=64 white_keys=16 tracks=8 track_keys=8 reserved_black=3" build/wp2_8_pattern_input_tests.log

      - name: Run STEP REC and special-event editor tests
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_step_record_tests.sh | tee build/wp2_8_step_record_tests.log
          grep -F "FMT_STEP_RECORD_TESTS_OK=1" build/wp2_8_step_record_tests.log
          grep -F "state_bytes=3 pattern=0 note_min=0 note_max=127 wrap=63_to_0 chord=lowest_key specials=empty,tie,off fx_modifier=tested" build/wp2_8_step_record_tests.log

      - name: Run explicit special-event playback tests
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_playback_tests.sh | tee build/wp2_8_playback_tests.log
          grep -F "FMT_PLAYBACK_TESTS_OK=1" build/wp2_8_playback_tests.log
          grep -F "loop_frames_120=352800" build/wp2_8_playback_tests.log
          grep -F "event_bytes=4 kinds=none,note,tie,off" build/wp2_8_playback_tests.log

      - name: Preserve WP2.5 SEQ versus performance gesture regression
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_pattern_context_host.sh | tee build/wp2_8_wp2_5_context_gate.log
          grep -F "WP2_5_PATTERN_CONTEXT_HOST_OK=1" build/wp2_8_wp2_5_context_gate.log

      - name: Preserve WP2.6 track-selection context regression
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_track_selection_context_host.sh | tee build/wp2_8_wp2_6_context_gate.log
          grep -F "WP2_6_TRACK_CONTEXT_HOST_OK=1" build/wp2_8_wp2_6_context_gate.log

      - name: Preserve WP2.7 STEP REC gesture regression
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_step_rec_context_host.sh | tee build/wp2_8_wp2_7_context_gate.log
          grep -F "WP2_7_STEP_REC_CONTEXT_HOST_OK=1" build/wp2_8_wp2_7_context_gate.log

      - name: Verify WP2.8 special-event panel and audio behavior
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_special_events_context_host.sh | tee build/wp2_8_special_context_gate.log
          grep -F "WP2_8_OFF_AUDIO_BEHAVIOR_OK=1" build/wp2_8_special_context_gate.log
          grep -F "WP2_8_SPECIAL_EVENTS_CONTEXT_HOST_OK=1" build/wp2_8_special_context_gate.log

      - name: Verify frozen WP2.4 audible host regression
        shell: bash
        run: |
          set -euo pipefail
          ./tests/run_host.sh
          test -s build/host/fm1tracker.wav
          sha="$(sha256sum build/host/fm1tracker.wav | awk '{print $1}')"
          echo "HOST_WAV_SHA256=$sha" | tee build/wp2_8_host_audio.txt
          test "$sha" = "453dc6b7a2f06a24b1a236ecd692b9beca59f8a070fdc954c4ea1c79c0e13440"
          echo "WP2_4_AUDIO_REGRESSION_UNCHANGED=1" | tee -a build/wp2_8_host_audio.txt

      - name: Install pinned JieLi toolchain
        shell: bash
        run: |
          set -euo pipefail
          ./tools/get_toolchain.sh "$RUNNER_TEMP/jieli"
          test -x "$RUNNER_TEMP/jieli/toolchain/pi32v2/bin/clang"
          "$RUNNER_TEMP/jieli/toolchain/pi32v2/bin/clang" --version | head -n 2

      - name: Checkout exact official JieLi AC79 SDK release
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/ac79-sdk"
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$sdk"
          actual="$(git -C "$sdk" rev-parse HEAD)"
          echo "AC79_SDK_COMMIT=$actual"
          test "$actual" = "d179b4484759423312073f5fbb232501aa491047"
          test "$(sha256sum "$sdk/cpu/wl82/tools/uboot.boot" | awk '{print $1}')" = \
            "4e3b4c220dc96641cb5a723f41e68ce41d5261ae9434bb33fbd7f2c59976ded4"
          test "$(sha256sum "$sdk/cpu/wl82/tools/cfg_tool.bin" | awk '{print $1}')" = \
            "276579954f076886a6a7694f65dc71c034a63a2c204b76749065c0ac7b010d1b"
          test "$(sha256sum "$sdk/cpu/wl82/tools/cfg/eq_cfg_hw.bin" | awk '{print $1}')" = \
            "41167491bffed4651750719c973d2758adeb9021a5670d02d6a53c85ed80ea7d"
          echo "AC79_SDK_INPUTS_OK=1"

      - name: Build WP2.8 device package
        shell: bash
        run: |
          set -euo pipefail
          JIELI_TOOLCHAIN="$RUNNER_TEMP/jieli/toolchain" \
          AC79_SDK="$RUNNER_TEMP/ac79-sdk" \
          ./build.sh --release 0.1 | tee build/wp2_8_device_build.log

      - name: Capture linked runtime symbols
        shell: bash
        run: |
          set -euo pipefail
          test -s build/fm1tracker.elf
          "$RUNNER_TEMP/jieli/toolchain/common/bin/objdump" -t build/fm1tracker.elf > build/wp2_8_symbols.txt
          grep -E 'fmt_store_storage$' build/wp2_8_symbols.txt | tee build/wp2_8_store_symbol.txt
          grep -E 'fmt_transport_runtime$' build/wp2_8_symbols.txt | tee build/wp2_8_transport_symbol.txt
          grep -E 'fmt_playback_runtime$' build/wp2_8_symbols.txt | tee build/wp2_8_playback_symbol.txt
          grep -E 'fmt_pattern_input_runtime$' build/wp2_8_symbols.txt | tee build/wp2_8_pattern_input_symbol.txt
          grep -E 'fmt_step_record_runtime$' build/wp2_8_symbols.txt | tee build/wp2_8_step_record_symbol.txt
          grep -E 'fmt_store_storage$' build/wp2_8_symbols.txt | grep -F '.pool'
          grep -E 'fmt_transport_runtime$|fmt_playback_runtime$|fmt_pattern_input_runtime$|fmt_step_record_runtime$' build/wp2_8_symbols.txt | grep -F '.bss'

      - name: Verify identity safety and WP2.8 budgets
        shell: bash
        run: |
          set -euo pipefail
          test -s build/fm1tracker.bin
          test -s build/fm1tracker-0.1.fwsc
          grep -F "register access: hal/ only (src/, loader/ clean)" build/wp2_8_device_build.log

          PYTHONPATH=tools python3 - <<'PY'
          from pathlib import Path
          from fm1_install import product_of
          raw = Path("build/fm1tracker-0.1.fwsc").read_bytes()
          product = product_of(raw)
          assert product == "FM-1_987", product
          print("PACKAGE_IDENTITY=" + product)
          PY

          python3 - <<'PY' | tee build/wp2_8_metrics.txt
          import hashlib
          import os
          import re
          from pathlib import Path

          build_log = Path("build/wp2_8_device_build.log").read_text()
          m = re.search(r"image (\d+) B of (\d+); RAM \.data\+\.bss (\d+) B of 98304; pool (\d+) B of 344064", build_log)
          assert m, "resource line not found"
          image, image_limit, ram, pool = map(int, m.groups())
          base_image, base_ram, base_pool = 56548, 12404, 96616

          symbols = Path("build/wp2_8_symbols.txt").read_text().splitlines()
          def one(name):
              lines = [line for line in symbols if line.rstrip().endswith(name)]
              assert len(lines) == 1, (name, lines)
              return lines[0].split()

          store = one("fmt_store_storage")
          transport = one("fmt_transport_runtime")
          playback = one("fmt_playback_runtime")
          pattern_input = one("fmt_pattern_input_runtime")
          step_record = one("fmt_step_record_runtime")

          assert ".pool" in store
          for sym in (transport, playback, pattern_input, step_record):
              assert ".bss" in sym

          store_address = int(store[0], 16)
          store_size = int(store[-2], 16)
          transport_size = int(transport[-2], 16)
          playback_size = int(playback[-2], 16)
          pattern_input_size = int(pattern_input[-2], 16)
          step_record_address = int(step_record[0], 16)
          step_record_size = int(step_record[-2], 16)

          assert store_address == 0x01C20000
          assert store_size == 65896
          assert transport_size == 8
          assert playback_size == 1
          assert pattern_input_size == 4
          assert step_record_size == 3
          assert pool == base_pool, (pool, base_pool)
          assert ram >= base_ram, (ram, base_ram)
          assert ram - base_ram <= 32, (ram, base_ram)
          assert image >= base_image, (image, base_image)
          assert image - base_image <= 4096, (image, base_image)

          print("WP2.8 special-event semantics metrics")
          print(f"commit={os.environ['GITHUB_SHA']}")
          print(f"image_bytes={image}")
          print(f"image_limit_bytes={image_limit}")
          print(f"image_delta_bytes={image - base_image}")
          print(f"normal_ram_bytes={ram}")
          print(f"normal_ram_delta_bytes={ram - base_ram}")
          print(f"pool_ram_bytes={pool}")
          print(f"pool_ram_delta_bytes={pool - base_pool}")
          print(f"pattern_input_state_bytes={pattern_input_size}")
          print(f"step_record_state_bytes={step_record_size}")
          print(f"step_record_state_address=0x{step_record_address:08x}")
          print(f"store_bytes={store_size}")
          print(f"store_address=0x{store_address:08x}")
          print("special_editor=empty,tie,off")
          print("playback_kinds=none,note,tie,off")
          print("cursor_wrap=63_to_0")
          print(f"fm1tracker_bin_sha256={hashlib.sha256(Path('build/fm1tracker.bin').read_bytes()).hexdigest()}")
          print(f"fm1tracker_fwsc_sha256={hashlib.sha256(Path('build/fm1tracker-0.1.fwsc').read_bytes()).hexdigest()}")
          print(f"host_wav_sha256={hashlib.sha256(Path('build/host/fm1tracker.wav').read_bytes()).hexdigest()}")
          PY

          grep -F "pool_ram_delta_bytes=0" build/wp2_8_metrics.txt
          grep -F "step_record_state_bytes=3" build/wp2_8_metrics.txt
          grep -F "special_editor=empty,tie,off" build/wp2_8_metrics.txt
          grep -F "playback_kinds=none,note,tie,off" build/wp2_8_metrics.txt
          echo "WP2_8_SPECIAL_EVENTS_AND_BUDGET_OK=1"

      - name: Upload WP2.8 evidence
        uses: actions/upload-artifact@v4
        with:
          name: wp2-8-special-events-evidence
          path: |
            build/wp2_8_model_tests.log
            build/wp2_8_store_tests.log
            build/wp2_8_transport_tests.log
            build/wp2_8_pattern_input_tests.log
            build/wp2_8_step_record_tests.log
            build/wp2_8_playback_tests.log
            build/wp2_8_wp2_5_context_gate.log
            build/wp2_5_pattern_context_host.log
            build/wp2_8_wp2_6_context_gate.log
            build/wp2_6_track_context_host.log
            build/wp2_8_wp2_7_context_gate.log
            build/wp2_7_step_rec_context_host.log
            build/wp2_8_special_context_gate.log
            build/wp2_8_special_events_context_host.log
            build/wp2_8_host_audio.txt
            build/wp2_8_device_build.log
            build/wp2_8_symbols.txt
            build/wp2_8_store_symbol.txt
            build/wp2_8_transport_symbol.txt
            build/wp2_8_playback_symbol.txt
            build/wp2_8_pattern_input_symbol.txt
            build/wp2_8_step_record_symbol.txt
            build/wp2_8_metrics.txt
            build/fm1tracker.bin
            build/fm1tracker-0.1.fwsc
            build/host/fm1tracker.wav
            build/host/fm1tracker-*.png
            build/host/fm1tracker_wp2_8.wav
          if-no-files-found: error
          retention-days: 14
