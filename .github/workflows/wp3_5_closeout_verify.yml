name: WP3.5 full closeout verification

# Historical WP3.5 proof. Manual reruns always verify the exact green source/workflow checkpoint.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playback-closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified WP3.5 checkpoint
        uses: actions/checkout@v4
        with:
          ref: 17316f203dba7a93c9d03a52df6f45b12a7a2580
          fetch-depth: 0

      - name: Verify exact historical checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "17316f203dba7a93c9d03a52df6f45b12a7a2580"
          echo "WP3_5_HISTORICAL_CHECKPOINT_OK=1"

      - name: Install host screenshot dependency
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Run complete frozen WP3.5 closeout gate
        shell: bash
        run: sh tests/run_wp3_5_closeout_ci.sh

      - name: Upload WP3.5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp3-5-playback-evidence
          if-no-files-found: warn
          path: |
            build/wp3_5_*.log
            build/wp3_5_*.txt
            build/wp3_5_*.o
            build/fm1tracker.bin
            build/fm1tracker-0.1.fwsc
            build/host/fm1tracker.wav
            build/host/fm1tracker_wp3_5_control.wav
            build/host/fm1tracker_wp3_5_locked.wav
