name: WP4.9 Gate 4 host probe patch once

on:
  push:
    branches:
      - phase4/8bit-engine
    paths:
      - .github/tmp/wp4_9_gate4_host_probe_patch.py
      - .github/workflows/_wp4_9_gate4_host_probe_patch_once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Gate 4 host probe command
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tmp/wp4_9_gate4_host_probe_patch.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/host.c
          git commit -m 'test: add D045 Gate 4 engine probe command'
          git push origin HEAD:phase4/8bit-engine
