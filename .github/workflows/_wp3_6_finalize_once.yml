name: WP3.6 finalize historical workflows once

on:
  push:
    branches:
      - phase3/plocks-effects
    paths:
      - .github/workflows/_wp3_6_finalize_once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze permanent WP3.6 workflows and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          checkpoint = 'd1910cb86b84240051cedfabb7701140259d8274'
          for name in ('.github/workflows/wp3_6_closeout_verify.yml',
                       '.github/workflows/wp3_6_tracker_effect_verify.yml'):
              p = Path(name)
              s = p.read_text()
              a = s.index('on:\n')
              b = s.index('\npermissions:', a)
              s = s[:a] + 'on:\n  workflow_dispatch:\n' + s[b:]
              needle = '        with:\n          fetch-depth: 0\n'
              assert s.count(needle) == 1, (name, s.count(needle))
              repl = f'        with:\n          ref: {checkpoint}\n          fetch-depth: 0\n'
              s = s.replace(needle, repl, 1)
              anchor = repl + '\n'
              verify = ("      - name: Verify exact historical checkpoint\n"
                        "        shell: bash\n"
                        "        run: |\n"
                        "          set -euo pipefail\n"
                        f"          test \"$(git rev-parse HEAD)\" = \"{checkpoint}\"\n"
                        "          echo 'WP3_6_HISTORICAL_CHECKPOINT_OK=1'\n\n")
              assert s.count(anchor) == 1, (name, 'checkout anchor')
              s = s.replace(anchor, anchor + verify, 1)
              p.write_text(s)
          PY

          git rm -f --ignore-unmatch \
            .github/workflows/_fix2_wp3_6_hygiene_once.yml \
            .github/workflows/_fix_wp3_6_hygiene_once.yml \
            .github/workflows/_wp3_6_closeout_docs_once.yml \
            .github/workflows/_wp3_6_fix_closeout_marker2_once.yml \
            .github/workflows/_wp3_6_fix_closeout_marker_once.yml \
            .github/workflows/_wp3_6_host_hygiene_exec_once.yml \
            .github/workflows/_wp3_6_append_d032_once.yml \
            .github/workflows/_wp3_6_decision_once.yml \
            .github/workflows/_wp3_6_start_once.yml \
            .github/workflows/_wp3_6_finalize_once.yml
          git diff --check

      - name: Commit final workflow hygiene
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/wp3_6_closeout_verify.yml .github/workflows/wp3_6_tracker_effect_verify.yml
          git add -u .github/workflows
          git commit -m 'ci: freeze WP3.6 historical verification'
          git push origin HEAD:phase3/plocks-effects
