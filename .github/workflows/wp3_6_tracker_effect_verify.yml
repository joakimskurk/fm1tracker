name: WP3.6 historical tracker effect verification

# Historical focused proof. Manual reruns always checkout the exact green WP3.6 checkpoint.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  effect-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified WP3.6 checkpoint
        uses: actions/checkout@v4
        with:
          ref: d1910cb86b84240051cedfabb7701140259d8274
          fetch-depth: 0

      - name: Verify exact historical checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d1910cb86b84240051cedfabb7701140259d8274"
          echo "WP3_6_FOCUSED_HISTORICAL_CHECKPOINT_OK=1"

      - name: Install host screenshot dependency
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Run D032 tracker effect core tests
        run: sh tests/run_tracker_effect_tests.sh

      - name: Run exact D020/D032 rendered-frame tick grid
        run: sh tests/run_wp3_6_tick_grid_tests.sh

      - name: Run inherited playback parameter tests
        run: sh tests/run_playback_params_tests.sh

      - name: Run inherited playback tests
        run: sh tests/run_playback_tests.sh

      - name: Run inherited lock store tests
        run: sh tests/run_lock_store_tests.sh

      - name: Run inherited lock editor tests
        run: sh tests/run_lock_editor_tests.sh

      - name: Run full-app D032 effect audio proof
        run: sh tests/run_wp3_6_effect_audio_host.sh
