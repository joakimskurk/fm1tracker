name: WP4.9 Gate 5 canonical freeze once

on:
  push:
    branches:
      - phase4/8bit-engine
    paths:
      - .github/tmp/wp4_9_gate5_freeze.py
      - .github/workflows/_wp4_9_gate5_freeze_once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Freeze Gate 5 discovery values
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tmp/wp4_9_gate5_freeze.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/run_wp4_9_linked_audio_host.sh
          git commit -m 'test: freeze D045 Gate 5 linked audio matrix'
          git push origin HEAD:phase4/8bit-engine
