name: WP4.7 deterministic allocator verification

on:
  push:
    branches:
      - phase4/8bit-engine
    paths:
      - firmware/src/fmt_voice_allocator.h
      - firmware/src/fmt_voice_allocator.c
      - tests/test_wp4_7_allocator.c
      - tests/run_wp4_7_allocator_tests.sh
      - .github/workflows/wp4_7_allocator_verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  allocator-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FM1Tracker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove isolated D043 production boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE=d9f6bf350bcb15a8f3dc62c4fc1112c9f0f1ffa2
          git diff --name-only "$BASE"...HEAD -- firmware/src | sort > /tmp/wp4_7_prod.txt
          printf '%s\n' \
            firmware/src/fmt_voice_allocator.c \
            firmware/src/fmt_voice_allocator.h | sort > /tmp/wp4_7_expected.txt
          diff -u /tmp/wp4_7_expected.txt /tmp/wp4_7_prod.txt
          git diff --quiet "$BASE"...HEAD -- firmware/src/dinghy.c
          git diff --quiet "$BASE"...HEAD -- firmware/src/fmt_envelope.c firmware/src/fmt_envelope.h
          git diff --quiet "$BASE"...HEAD -- firmware/src/fmt_engine_pitch.c firmware/src/fmt_engine_pitch.h
          git diff --quiet "$BASE"...HEAD -- firmware/src/fmt_osc_pulse.c firmware/src/fmt_osc_pulse.h
          git diff --quiet "$BASE"...HEAD -- firmware/src/fmt_osc_noise.c firmware/src/fmt_osc_noise.h
          git diff --quiet "$BASE"...HEAD -- firmware/src/fmt_osc_triangle.c firmware/src/fmt_osc_triangle.h
          git diff --quiet "$BASE"...HEAD -- firmware/src/fmt_osc_wavetable8.c firmware/src/fmt_osc_wavetable8.h
          echo 'WP4_7_ISOLATED_SOURCE_BOUNDARY_OK=1 new_modules=2 dinghy_delta=0 oscillator_envelope_delta=0'

      - name: Run focused deterministic allocator tests
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_wp4_7_allocator_tests.sh

      - name: Static realtime/source audit
        shell: bash
        run: |
          set -euo pipefail
          SRC=firmware/src/fmt_voice_allocator.c
          test "$(grep -Ec '^[[:space:]]*for[[:space:]]*\(' "$SRC" || true)" -le 8
          test "$(grep -Ec '^[[:space:]]*while[[:space:]]*\(' "$SRC" || true)" -eq 0
          ! grep -Eq '\b(malloc|calloc|realloc|free)[[:space:]]*\(' "$SRC"
          ! grep -Eq '\b(float|double|int64_t|uint64_t)\b' "$SRC"
          ! grep -Eq '\bfmt_(store|lock|tracker_screen)_' "$SRC"
          ! grep -Eq '[^*/]/[^/*]|%' "$SRC"
          grep -F 'if (allocator->clock != UINT32_MAX)' "$SRC" >/dev/null
          grep -F 'allocator->clock++;' "$SRC" >/dev/null
          grep -F 'allocator->voice_owner[i] != FMT_TRACK_NONE ||' "$SRC" >/dev/null
          grep -F 'stage[i] != FMT_ENVELOPE_RELEASE)' "$SRC" >/dev/null
          grep -F 'allocator->age[i] < candidate_age' "$SRC" >/dev/null
          echo 'WP4_7_STATIC_AUDIT_OK=1 fixed_slot_scans=1 alloc=0 float=0 int64=0 divide_modulo=0 store_traversal=0 active_cross_track_steal=0'

  allocator-target-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FM1Tracker
        uses: actions/checkout@v4

      - name: Fetch pinned JieLi toolchain
        shell: bash
        run: |
          set -euo pipefail
          ./tools/get_toolchain.sh "$RUNNER_TEMP/jieli"
          test -x "$RUNNER_TEMP/jieli/toolchain/pi32v2/bin/clang"

      - name: Compile D043 allocator for PI32v2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/wp4_7_target
          CC="$RUNNER_TEMP/jieli/toolchain/pi32v2/bin/clang"
          "$CC" -target pi32v2 -Os -ffunction-sections -fno-builtin -Wall -Werror \
            -Ifirmware/src -c firmware/src/fmt_voice_allocator.c \
            -o build/wp4_7_target/fmt_voice_allocator.o
          test -s build/wp4_7_target/fmt_voice_allocator.o
          sha256sum build/wp4_7_target/fmt_voice_allocator.o \
            | tee build/wp4_7_target/object_sha256.txt
          echo 'WP4_7_PI32V2_COMPILE_OK=1 allocator_bytes=52 result_bytes=4 slots=8' \
            | tee build/wp4_7_target/summary.txt

      - name: Upload target object evidence
        uses: actions/upload-artifact@v4
        with:
          name: wp4-7-allocator-target-object
          path: build/wp4_7_target/
