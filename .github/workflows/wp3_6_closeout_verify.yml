name: WP3.6 historical closeout verification

# Historical WP3.6 proof. Manual reruns always checkout the exact green source/workflow checkpoint.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracker-effects-historical:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified WP3.6 checkpoint
        uses: actions/checkout@v4
        with:
          ref: d1910cb86b84240051cedfabb7701140259d8274
          fetch-depth: 0

      - name: Verify exact historical checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d1910cb86b84240051cedfabb7701140259d8274"
          echo "WP3_6_HISTORICAL_CHECKPOINT_OK=1"

      - name: Install host screenshot dependency
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Run D032 effect and timing proofs
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_tracker_effect_tests.sh | tee build_wp3_6_effect_tests.log
          grep -F 'FMT_TRACKER_EFFECT_TESTS_OK=1' build_wp3_6_effect_tests.log
          sh tests/run_wp3_6_tick_grid_tests.sh | tee build_wp3_6_tick_grid.log
          grep -F 'WP3_6_TICK_GRID_TESTS_OK=1' build_wp3_6_tick_grid.log
          sh tests/run_wp3_6_effect_audio_host.sh | tee build_wp3_6_effect_audio.log
          grep -F 'WP3_6_EFFECT_AUDIO_BEHAVIOR_OK=1 arp_ticks=1 slide_up=1 slide_down=1 porta_glide=1 vibrato=1 fine_composition=1 invalid_none=1 midi_events=0' build_wp3_6_effect_audio.log
          grep -F 'WP3_6_INVALID_COMMAND_AUDIO_IDENTICAL=1' build_wp3_6_effect_audio.log

      - name: Run inherited p-lock/playback foundations
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_playback_params_tests.sh | grep -F 'FMT_PLAYBACK_PARAMS_TESTS_OK=1'
          sh tests/run_playback_tests.sh | grep -F 'FMT_PLAYBACK_TESTS_OK=1'
          sh tests/run_lock_store_tests.sh | grep -F 'FMT_LOCK_STORE_TESTS_OK=1'
          sh tests/run_lock_editor_tests.sh | grep -F 'FMT_LOCK_EDITOR_TESTS_OK=1'
          sh tests/run_param_registry_tests.sh | grep -F 'FMT_PARAM_REGISTRY_TESTS_OK=1'

      - name: Preserve inherited frozen audio
        shell: bash
        run: |
          set -euo pipefail
          ./tests/run_host.sh
          test "$(sha256sum build/host/fm1tracker.wav | awk '{print $1}')" = "453dc6b7a2f06a24b1a236ecd692b9beca59f8a070fdc954c4ea1c79c0e13440"
          sh tests/run_wp3_5_locked_audio_host.sh
          test "$(sha256sum build/host/fm1tracker_wp3_5_locked.wav | awk '{print $1}')" = "8d2e478e366c0af18b0631da268ba75cc358157d043c567bee2e734852d0e9a8"
          echo "WP3_6_HISTORICAL_AUDIO_REGRESSIONS_OK=1"
