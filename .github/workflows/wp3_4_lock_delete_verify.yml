name: WP3.4 p-lock browse/delete verification (frozen)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-delete-closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified WP3.4 checkpoint
        uses: actions/checkout@v4
        with:
          ref: 178ba57a19adc8e25106f1c63e0df2f16478fb33
          fetch-depth: 0

      - name: Install inherited host-screen dependency
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Verify pinned checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "178ba57a19adc8e25106f1c63e0df2f16478fb33"
          echo "WP3_4_FROZEN_CHECKPOINT_OK=1"

      - name: Run complete frozen WP3.4 gate
        shell: bash
        run: sh tests/run_wp3_4_closeout_ci.sh

      - name: Upload frozen WP3.4 evidence
        uses: actions/upload-artifact@v4
        with:
          name: wp3-4-lock-delete-evidence-frozen
          path: |
            build/wp3_4_*.log
            build/wp3_4_*.txt
            build/wp3_4_fmt_lock_editor.o
            build/fm1tracker.bin
            build/fm1tracker-0.1.fwsc
            build/host/fm1tracker.wav
            build/host/fm1tracker_wp3_4_lock_delete-1000.ppm
            build/host/fm1tracker_wp3_4_lock_delete-3000.ppm
            build/host/fm1tracker_wp3_4_lock_delete-1000.png
            build/host/fm1tracker_wp3_4_lock_delete-3000.png
