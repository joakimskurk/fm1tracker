name: WP3.4 p-lock browse/delete verification

on:
  push:
    branches:
      - phase3/plocks-effects
    paths:
      - .github/workflows/wp3_4_lock_delete_verify.yml
      - firmware/src/dinghy.c
      - firmware/src/fmt_lock_editor.h
      - firmware/src/fmt_lock_editor.c
      - tests/host.c
      - tests/test_fmt_lock_editor.c
      - tests/run_lock_editor_tests.sh
      - tests/wp3_4_lock_delete_context.script
      - tests/run_lock_delete_context_host.sh
      - tests/run_wp3_4_closeout_ci.sh
      - docs/PROJECT_STATE.md
      - docs/DECISIONS.md
      - docs/CONTROL_MAP_V0.1.md
      - docs/WORK_PACKAGES.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-delete-closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FM1Tracker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install inherited host-screen dependency
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Verify WP3.4 scope
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          base = '8ffa2a3de00f89946aca37fa7015fd3940851c93'
          allowed = {
              '.github/workflows/wp3_4_lock_delete_verify.yml',
              'docs/PROJECT_STATE.md',
              'docs/DECISIONS.md',
              'docs/CONTROL_MAP_V0.1.md',
              'docs/WORK_PACKAGES.md',
              'firmware/src/dinghy.c',
              'firmware/src/fmt_lock_editor.h',
              'firmware/src/fmt_lock_editor.c',
              'tests/host.c',
              'tests/test_fmt_lock_editor.c',
              'tests/run_lock_editor_tests.sh',
              'tests/wp3_4_lock_delete_context.script',
              'tests/run_lock_delete_context_host.sh',
              'tests/run_wp3_4_closeout_ci.sh',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', base, 'HEAD'], text=True
          ).splitlines())
          unexpected = sorted(changed - allowed)
          assert not unexpected, unexpected
          print('WP3_4_SCOPE_OK=1')
          PY

      - name: Run complete WP3.4 gate
        shell: bash
        run: sh tests/run_wp3_4_closeout_ci.sh

      - name: Upload WP3.4 evidence
        uses: actions/upload-artifact@v4
        with:
          name: wp3-4-lock-delete-evidence
          path: |
            build/wp3_4_*.log
            build/wp3_4_*.txt
            build/wp3_4_fmt_lock_editor.o
            build/fm1tracker.bin
            build/fm1tracker-0.1.fwsc
            build/host/fm1tracker.wav
            build/host/fm1tracker_wp3_4_lock_delete-1000.ppm
            build/host/fm1tracker_wp3_4_lock_delete-3000.ppm
            build/host/fm1tracker_wp3_4_lock_delete-1000.png
            build/host/fm1tracker_wp3_4_lock_delete-3000.png
