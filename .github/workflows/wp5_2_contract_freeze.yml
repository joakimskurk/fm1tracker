name: WP5.2 D050 contract freeze

on:
  workflow_dispatch:
  push:
    branches:
      - phase5/fm4-algorithms
    paths:
      - docs/WP5_2_FM_ALGORITHM_CONTRACT.md
      - tests/run_wp5_2_contract_freeze.sh
      - .github/workflows/wp5_2_contract_freeze.yml

permissions:
  contents: read

jobs:
  contract-freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FM1Tracker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install host UI dependency
        run: python3 -m pip install pillow

      - name: Verify D050 source-absent algorithm contract
        run: sh tests/run_wp5_2_contract_freeze.sh

      - name: Upload D050 contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp5-2-d050-contract-freeze
          path: |
            docs/WP5_2_FM_ALGORITHM_CONTRACT.md
            build/wp5_2_contract/
          if-no-files-found: warn
