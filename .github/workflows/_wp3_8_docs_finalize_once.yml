name: WP3.8 docs finalize once

on:
  push:
    branches:
      - phase3/plocks-effects
    paths:
      - .github/workflows/_wp3_8_docs_finalize_once.yml

permissions:
  contents: write

jobs:
  finalize-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize WP3.8 closeout and WP3.9 handoff
        run: python3 .github/tmp/wp3_8_docs_finalize.py

      - name: Commit synchronized handoff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add START_HERE.md docs/PROJECT_STATE.md docs/WORK_PACKAGES.md docs/ROADMAP.md docs/TEST_MATRIX.md CHANGELOG.md
          git commit -m 'docs: close WP3.8 and hand off to WP3.9'
          git push origin HEAD:phase3/plocks-effects
