name: WP4.5 WAVETABLE-8 verification

on:
  push:
    branches:
      - phase4/8bit-engine
    paths:
      - firmware/src/fmt_osc_wavetable8.h
      - firmware/src/fmt_osc_wavetable8.c
      - tests/test_wp4_5_wavetable8.c
      - tests/verify_wp4_5_table_data.py
      - tests/run_wp4_5_wavetable8_tests.sh
      - docs/WP4_5_WAVETABLE8_CONTRACT.md
      - .github/workflows/wp4_5_wavetable8_verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wavetable8-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FM1Tracker
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove isolated source boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE=64c9603795668b002cf2075bfaa72305384eb0fa
          actual="$(git diff --name-only "$BASE" -- firmware/src | sort)"
          expected="$(printf '%s\n' \
            firmware/src/fmt_osc_wavetable8.c \
            firmware/src/fmt_osc_wavetable8.h | sort)"
          test "$actual" = "$expected"
          git diff --exit-code "$BASE" -- firmware/src/dinghy.c
          git diff --exit-code "$BASE" -- \
            firmware/src/fmt_engine_pitch.c firmware/src/fmt_engine_pitch.h \
            firmware/src/fmt_osc_pulse.c firmware/src/fmt_osc_pulse.h \
            firmware/src/fmt_osc_noise.c firmware/src/fmt_osc_noise.h \
            firmware/src/fmt_osc_triangle.c firmware/src/fmt_osc_triangle.h
          echo 'WP4_5_ISOLATED_SOURCE_BOUNDARY_OK=1 new_modules=2 dinghy_delta=0 prior_engine_delta=0'

      - name: Run focused deterministic WAVETABLE-8 tests
        shell: bash
        run: |
          set -euo pipefail
          sh tests/run_wp4_5_wavetable8_tests.sh

      - name: Static realtime/source audit
        shell: bash
        run: |
          set -euo pipefail
          files='firmware/src/fmt_osc_wavetable8.h firmware/src/fmt_osc_wavetable8.c'
          ! grep -nE '\b(float|double|malloc|calloc|realloc|free)\b' $files
          ! grep -nE '\b(uint64_t|int64_t|long[[:space:]]+long)\b' $files
          ! grep -nE '\b(for|while|do)[[:space:]]*\(' firmware/src/fmt_osc_wavetable8.c
          ! grep -nE 'Fmt(Song|Step|Lock|Tracker|RtQueue)|fmt_lock_|fmt_store_' firmware/src/fmt_osc_wavetable8.c
          grep -F 'uint32_t phase;' firmware/src/fmt_osc_wavetable8.h
          grep -F 'index = osc->phase >> FMT_WAVETABLE8_INDEX_SHIFT;' firmware/src/fmt_osc_wavetable8.c
          grep -F '* FMT_WAVETABLE8_Q15_SCALE;' firmware/src/fmt_osc_wavetable8.c
          grep -F 'osc->phase += phase_increment;' firmware/src/fmt_osc_wavetable8.c
          echo 'WP4_5_STATIC_AUDIT_OK=1 wavetable_loops=0 alloc=0 float=0 int64=0 store_traversal=0 immutable_table_bytes=256'

  wavetable8-target-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FM1Tracker
        uses: actions/checkout@v4

      - name: Fetch pinned JieLi toolchain
        shell: bash
        run: |
          set -euo pipefail
          ./tools/get_toolchain.sh "$RUNNER_TEMP/jieli"
          test -x "$RUNNER_TEMP/jieli/toolchain/pi32v2/bin/clang"
          "$RUNNER_TEMP/jieli/toolchain/pi32v2/bin/clang" --version | head -n 2

      - name: Compile D041 module for PI32v2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/wp4_5_target
          CC="$RUNNER_TEMP/jieli/toolchain/pi32v2/bin/clang"
          "$CC" -target pi32v2 -Os -ffunction-sections -fno-builtin -Wall -Werror \
            -Ifirmware/src -c firmware/src/fmt_engine_pitch.c \
            -o build/wp4_5_target/fmt_engine_pitch.o
          "$CC" -target pi32v2 -Os -ffunction-sections -fno-builtin -Wall -Werror \
            -Ifirmware/src -c firmware/src/fmt_osc_wavetable8.c \
            -o build/wp4_5_target/fmt_osc_wavetable8.o
          test -s build/wp4_5_target/fmt_engine_pitch.o
          test -s build/wp4_5_target/fmt_osc_wavetable8.o
          PITCH_SHA="$(sha256sum build/wp4_5_target/fmt_engine_pitch.o | awk '{print $1}')"
          test "$PITCH_SHA" = '6203ee8b5ab68a1000066c25a52b674dbed9a61ff30eb7579bf29a07abe69f20'
          sha256sum build/wp4_5_target/fmt_engine_pitch.o build/wp4_5_target/fmt_osc_wavetable8.o \
            | tee build/wp4_5_target/object_sha256.txt
          echo 'WP4_5_PI32V2_COMPILE_OK=1 modules=2 pitch_object_unchanged=1 table_data_bytes=256' | tee build/wp4_5_target/summary.txt

      - name: Upload target object evidence
        uses: actions/upload-artifact@v4
        with:
          name: wp4-5-wavetable8-target-objects
          path: build/wp4_5_target/
