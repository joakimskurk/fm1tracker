name: WP3.7 freeze D033 once

on:
  push:
    branches:
      - phase3/plocks-effects
    paths:
      - .github/workflows/_wp3_7_d033_once.yml

permissions:
  contents: write

jobs:
  decision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append D033 and mark WP3.7 active
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/wp3_7_d033.py
          python3 /tmp/wp3_7_d033.py
          git diff --check

      - name: Commit D033 architecture gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DECISIONS.md docs/PROJECT_STATE.md docs/WORK_PACKAGES.md
          git commit -m 'docs: freeze D033 row-event contract'
          git push origin HEAD:phase3/plocks-effects
