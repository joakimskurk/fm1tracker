name: WP2.10 Phase 2 integration verification (historical)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified Phase 2 closeout checkpoint
        uses: actions/checkout@v4
        with:
          ref: 7063be51e53c2657178084b3bef5ace813dafcd7
          fetch-depth: 0

      - name: Record frozen verification evidence
        run: |
          echo "WP2_10_VERIFIED_COMMIT=7063be51e53c2657178084b3bef5ace813dafcd7"
          echo "WP2_10_VERIFIED_RUN=40015242947"
          echo "WP2_10_VERIFIED_JOB=120625519388"
          echo "WP2_10_EVIDENCE=docs/PHASE2_VERIFICATION.md"
          echo "WP2_10_EVIDENCE_ARTIFACT_ID=12527623388"
          test "$(git rev-parse HEAD)" = "7063be51e53c2657178084b3bef5ace813dafcd7"
